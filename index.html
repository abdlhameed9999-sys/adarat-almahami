:root{--bg:#0e1a2b;--card:#16273d;--line:#243a57;--teal:#3fb8a8;--sand:#e3c48f;--tx:#e8eef5;--mu:#8ea0b5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--bg:#0e1a2b}
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Tajawal',Tahoma,Arial,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
aside{position:fixed;top:0;bottom:0;right:0;width:250px;background:#0a1422;border-left:1px solid var(--line);padding:18px 12px;z-index:30;overflow:auto}
.brand{padding:6px 10px 18px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand b{display:block;font-size:22px;font-weight:800;color:var(--sand)}
.brand small{font-size:11px;color:var(--teal)}
nav button{display:flex;gap:10px;width:100%;text-align:right;background:none;border:0;padding:11px 12px;border-radius:10px;color:var(--mu);font-weight:500;margin-bottom:3px}
nav button:hover{background:var(--card)}
nav button.on{background:rgba(63,184,168,.15);color:var(--teal);font-weight:700}
main{margin-right:250px;padding:28px;max-width:1150px}
.top{display:none}
h1{margin:0;font-size:24px;font-weight:800}
.sub{color:var(--mu);margin:4px 0 18px;font-size:13px}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.st .l{font-size:12px;color:var(--mu)}
.st .v{font-size:23px;font-weight:800;margin-top:6px}
.v.t{color:var(--teal)}
.v.s{color:var(--sand)}
.btn{background:#16273d;color:#fff;border:1px solid #2b4463;border-radius:10px;padding:9px 16px;font-weight:700}
.btn.o{background:#16273d;border:1px solid var(--teal);color:#fff}
.btn.d{background:#16273d;border:1px solid var(--sand);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
.lesson{display:flex;align-items:center;gap:12px;margin-bottom:10px;border-inline-start:4px solid var(--line)}
.lesson.ok{border-inline-start-color:var(--teal);background:rgba(63,184,168,.13)}
.lesson .tm{font-weight:800;font-size:18px;min-width:62px;color:var(--sand)}
.lesson .in{flex:1}
.lesson .n{font-weight:700}
.mu{color:var(--mu);font-size:12px}
.att{border:1px solid #2b4463;border-radius:10px;padding:9px 14px;font-weight:700;background:#16273d;color:#fff}
.ok .att{background:var(--teal);color:#08211d}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--mu);font-weight:500;text-align:right;font-size:12px;padding:8px}
td{padding:10px 8px;border-top:1px solid var(--line)}
.wrap{overflow-x:auto}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;background:rgba(227,196,143,.15);color:var(--sand)}
.pill.t{background:rgba(63,184,168,.15);color:var(--teal)}
input,select,textarea{background:#0e1a2b;border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
input:focus,select:focus{outline:2px solid var(--teal)}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.days button{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 14px}
.days button.on{background:var(--teal);color:#08211d;border-color:var(--teal);font-weight:700}
.dr{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;margin-bottom:6px}
.dr label{display:flex;gap:6px;margin:0;color:var(--tx);font-size:14px}
.dr input[type=checkbox]{width:auto}
.empty{text-align:center;color:var(--mu);padding:34px 12px;border:1px dashed var(--line);border-radius:14px}
.task{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.task .c{width:24px;height:24px;border-radius:7px;border:2px solid var(--mu);display:flex;align-items:center;justify-content:center;flex:none;background:none;padding:0;color:#08211d}
.task.on .c{background:var(--teal);border-color:var(--teal)}
.task.on .tx{color:var(--mu);text-decoration:line-through}
.task .tx{flex:1}
.bt{height:8px;background:#0e1a2b;border-radius:9px;overflow:hidden;margin-top:5px}
.bt i{display:block;height:100%;background:var(--teal)}
details.card summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(560px,94vw);max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.6)}
.chip{background:var(--card);border:1px solid var(--teal);border-radius:12px;padding:7px 14px;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--mu)}
.chip b{color:var(--teal);font-size:17px}
.chk{width:42px;height:42px;border-radius:50%;border:2px solid var(--teal);background:none;color:var(--teal);font-size:20px;font-weight:800;flex:none}
.ok .chk{background:var(--teal);color:#08211d}
.btn.off{opacity:.45}
.lesson .tm{min-width:84px}
.dr2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.dr2>label{display:flex;gap:6px;margin:0;min-width:84px;color:var(--tx);font-size:14px}
.dr2 input[type=checkbox]{width:auto}
.tp{display:inline-flex;gap:3px;align-items:center}
.tp select{width:auto;padding:6px 4px}
.num{width:72px;padding:5px 8px;display:inline-block}
.tb{min-width:82px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:#0e1a2b;color:var(--tx)}
.tb.e{color:var(--mu)}
.pg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:6px 0 12px}
.pg button{background:#0e1a2b;border:1px solid var(--line);border-radius:9px;padding:11px 0;color:var(--tx)}
.pg button.on{background:var(--teal);color:#08211d;border-color:var(--teal);font-weight:700}
.tst{position:fixed;top:18px;bottom:auto;left:50%;transform:translateX(-50%);background:var(--sand);color:#2b2110;padding:10px 20px;border-radius:12px;font-weight:700;z-index:9999;display:none;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:min(92vw,760px);text-align:center}
@media(max-width:820px){
  aside{transform:translateX(100%);transition:.2s}
  aside.open{transform:none}
  main{margin:0;padding:16px}
  .top{display:flex;align-items:center;gap:12px;background:#0a1422;padding:10px 14px;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}
  .top button{background:none;border:0;font-size:22px}
  .top b{color:var(--sand)}
  .f2{grid-template-columns:1fr}
  .lesson{flex-wrap:wrap}
}
body{background-size:cover;background-attachment:fixed;background-position:center;background-repeat:no-repeat}
.sec{display:flex;align-items:center;gap:8px;margin:18px 0 10px;color:var(--sand);font-weight:800;font-size:16px}

/* === إدارة حسابات الشهر والتمييز بين الخاص والأكاديميات — إضافة مستقلة === */
function isPrivateStudent(s){
  return String(s&&s.academy||'').trim()==='خاص';
}
function accountYmShift(ym,delta){
  const p=String(ym||'').split('-');
  let y=parseInt(p[0],10)||0,m=(parseInt(p[1],10)||1)-1;
  const d=new Date(y,m+delta,1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function accountRawDur(s){
  const n=Number(s&&s.dur)||0;
  return n>0?n:45;
}
function accountRawRate(s){
  const r=Number(s&&s.rate)||0;
  if(r>0)return r;
  const mv=Number(s&&((s.monthlyValue??s.value)))||0;
  const lessons=Number(s&&s.lessons)||0, dur=accountRawDur(s);
  if(mv>0&&lessons>0&&dur>0)return mv/(lessons*(dur/60));
  return 0;
}
function accountMonthStudentRaw(s,ym){
  let n=0,h=0,amt=0;
  Object.entries(S.att||{}).forEach(([key,sid])=>{
    const parts=String(key).split('|'),date=parts.shift(),marker=parts.join('|');
    if(sid!==s.id||String(date).slice(0,7)!==String(ym))return;
    let dur=accountRawDur(s);
    if(marker.indexOf('x')===0){
      const ex=(S.ex||[]).find(z=>String(z.id)===marker.slice(1));
      if(ex&&Number(ex.dur)>0)dur=Number(ex.dur);
    }
    n++;h+=dur/60;amt+=(dur/60)*accountRawRate(s);
  });
  return {n,h,amt};
}
function accountMonthTotalsRaw(ym){
  let academy=0,privateTotal=0;
  (S.students||[]).forEach(s=>{
    const hasAcademy=String(s&&s.academy||'').trim();
    const x=accountMonthStudentRaw(s,ym);
    if(isPrivateStudent(s))privateTotal+=x.amt;
    else if(hasAcademy)academy+=x.amt;
  });
  return {academy,private:privateTotal};
}
function accountRangeTotalsRaw(fromYm,toYm){
  const from=String(fromYm||'');
  const to=String(toYm||fromYm||'');
  let academy=0,privateTotal=0;
  if(!from||!to||from>to)return {academy:0,private:0};
  const logs=(S.accounting&&Array.isArray(S.accounting.logs)?S.accounting.logs:[]);
  let cursor=from;
  while(cursor<=to){
    const logged=logs.find(x=>String(x&&x.month)===cursor);
    const t=logged?{academy:Number(logged.academy)||0,private:Number(logged.private)||0}:accountMonthTotalsRaw(cursor);
    academy+=t.academy;
    privateTotal+=t.private;
    cursor=accountYmShift(cursor,1);
  }
  return {academy,private:privateTotal};
}
function accountMonthLogEnsure(ym){
  S.accounting=S.accounting||{month:'',logs:[]};
  S.accounting.logs=Array.isArray(S.accounting.logs)?S.accounting.logs:[];
  if(!S.accounting.logs.some(x=>String(x&&x.month)===String(ym))){
    const t=accountMonthTotalsRaw(ym);
    S.accounting.logs.push({month:String(ym),academy:t.academy,private:t.private,at:Date.now()});
    if(S.accounting.logs.length>36)S.accounting.logs=S.accounting.logs.slice(-36);
    return true;
  }
  return false;
}
function ensureMonthlyAcademyReset(){
  S.accounting=S.accounting||{month:'',logs:[]};
  S.accounting.logs=Array.isArray(S.accounting.logs)?S.accounting.logs:[];
  const current=TD().slice(0,7), previous=accountYmShift(current,-1);
  const currentStart=current+'-01';

  if(!S.accounting.month){
    /* تشغيل أول مرة: اجعل رصيد الأكاديميات يعكس الشهر الحالي فقط، مع حفظ التاريخ القديم في S.att. */
    (S.students||[]).forEach(s=>{
      const a=String(s&&s.academy||'').trim();
      if(a && !a.includes('خاص') && !s.resetAt){
        const total=Object.values(S.att||{}).filter(x=>x===s.id).length;
        const currentCount=Object.entries(S.att||{}).filter(([key,sid])=>sid===s.id && String(key).slice(0,10)>=currentStart).length;
        s.adj=currentCount-total;
        s.resetAt=currentStart;
      }
    });
    S.accounting.month=current;
    return false;
  }
  if(String(S.accounting.month)===String(current))return false;

  let cursor=accountYmShift(String(S.accounting.month),1);
  while(cursor<=previous){
    accountMonthLogEnsure(cursor);
    cursor=accountYmShift(cursor,1);
  }

  /* بداية شهر جديد: تصفير طلاب الأكاديميات فقط مع الإبقاء على سجل الحضور القديم. */
  (S.students||[]).forEach(s=>{
    const a=String(s&&s.academy||'').trim();
    if(a && !a.includes('خاص')){
      const n=Object.values(S.att||{}).filter(x=>x===s.id).length;
      s.adj=-n;
      s.resetAt=TD();
    }
  });
  S.accounting.month=current;
  return true;
}

rep(){const A=S.students,act=A.filter(s=>!isStopped(s)),cm=TD().slice(0,7);
 const isAcc=s=>!!(s.academy&&s.academy.trim());
 const accs=[...new Set(A.filter(isAcc).map(s=>s.academy.trim()))];
 const priv=A.filter(s=>!isAcc(s));
 const idsOf=g=>new Set(g.map(s=>s.id));
 const monthHours=g=>g.reduce((a,s)=>a+hours(s),0);
 const monthlyDoneN=s=>Math.max(0,doneN(s));
 const monthlyDueForGroup=g=>g.reduce((a,s)=>a+(monthlyDoneN(s)*price(s)),0);
 const monthDue=g=>monthlyDueForGroup(g);
 const daily=ORD.map(day=>{const list=act.filter(s=>s.days&&s.days[day]);return {day,list,count:list.length,hours:list.reduce((a,s)=>a+s.dur/60,0),income:list.reduce((a,s)=>a+price(s),0)}});
 const weekly=daily.reduce((a,d)=>a+d.income,0);
 const totalExpected=A.reduce((a,s)=>a+price(s)*s.lessons,0);
 const from=normalizeRangeDate(V.rmf,false),to=normalizeRangeDate(V.rmt,true);
 const inRange=f=>{const d=String(f.date||'');return !f.auto&&(!from||d>=from)&&(!to||d<=to)};
 const rangeFin=S.fin.filter(inRange);
 const rangeTitle=from&&to?(from===to?`التقرير المالي لتاريخ ${dateLabel(from)}`:`التقرير المالي من ${dateLabel(from)} إلى ${dateLabel(to)}`):from?`التقرير المالي من ${dateLabel(from)}`:to?`التقرير المالي إلى ${dateLabel(to)}`:'التقرير المالي لكل التواريخ';
 const accCard=(name,g)=>`<div class="acccard"><h3>${esc(name)}</h3><div class="kv"><span>عدد الطلاب</span><b>${g.length}</b></div><div class="kv"><span>الساعات خلال الشهر</span><b>${fm(monthHours(g))}</b></div><div class="kv s"><span>المستحق خلال الشهر</span><b>${fm(monthDue(g))} جنيه</b></div></div>`;
 const accCards=accs.map(a=>accCard(a,A.filter(s=>isAcc(s)&&s.academy.trim()===a))).join('');
 const academyMonthlyDue=['نور الوحى','مصطفى'].reduce((sum,a)=>sum+monthDue(A.filter(s=>isAcc(s)&&s.academy.trim()===a)),0);
 const otherAcademiesMonthlyDue=accs.filter(a=>!['نور الوحى','مصطفى'].includes(a)).reduce((sum,a)=>sum+monthDue(A.filter(s=>isAcc(s)&&s.academy.trim()===a)),0);
 const privateMonthlyDue=monthDue(priv);
 const generalMonthlyDue=academyMonthlyDue+otherAcademiesMonthlyDue+privateMonthlyDue;
 const weekCards=daily.map(d=>`<div class="weekday"><b class="wdn">${d.day}</b><div class="wkv"><span>الحلقات</span><b>${d.count}</b></div><div class="wkv"><span>الساعات</span><b>${fm(d.hours)}</b></div><div class="wkv money"><span>الحساب</span><b>${fm(d.income)} جنيه</b></div></div>`).join('');

/* ---------- دمج الحالة على مستوى السجل (يعمل في المتصفح وفي Apps Script) ---------- */
function idaraAtoms(st){
  var A={},SKIP={hook:1,lastDay:1,auto:1,_syncUpdatedAt:1,_syncDevice:1,ts:1,exportSheets:1,_m:1};
  var IDA={students:1,fin:1,tasks:1,notes:1,ex:1,reports:1};
  var MAPS={att:1,reminded:1,remindDay:1,reportSent:1,dayOverrides:1,todayDoneOrder:1,theme:1};
  function isO(x){return x&&typeof x==='object'&&!Array.isArray(x)}
  function put(id,v){var j=JSON.stringify(v);if(j!==undefined)A[id]=j}
  Object.keys(st||{}).forEach(function(k){
    if(SKIP[k])return;
    var v=st[k];
    if(IDA[k]&&Array.isArray(v)){
      v.forEach(function(x){
        var j=JSON.stringify(x);if(j===undefined)return;
        var id=(x&&typeof x==='object'&&x.id!=null)?String(x.id):'~'+j;
        A['a:'+k+':'+id]=j;
      });
    }else if(MAPS[k]&&isO(v)){
      Object.keys(v).forEach(function(kk){put('m:'+k+':'+kk,v[kk])});
    }else if(k==='hide'&&isO(v)){
      Object.keys(v).forEach(function(d){
        (Array.isArray(v[d])?v[d]:[]).forEach(function(mb){A['s:hide:'+d+':'+mb]='1'});
      });
    }else if(k==='accounting'&&isO(v)){
      var rest={};Object.keys(v).forEach(function(q){if(q!=='logs')rest[q]=v[q]});
      put('k:accounting',rest);
      (Array.isArray(v.logs)?v.logs:[]).forEach(function(x){
        var j=JSON.stringify(x);if(j!==undefined)A['a:accounting.logs:~'+j]=j;
      });
    }else put('k:'+k,v);
  });
  return A;
}
function idaraSig(st){
  var A=idaraAtoms(st),o=[];
  Object.keys(A).sort().forEach(function(k){o.push(k+'='+A[k])});
  return o.join('\n');
}
function idaraMerge(L,R){
  L=L||{};R=R||{};
  var aL=idaraAtoms(L),aR=idaraAtoms(R);
  var legL=!L._m,legR=!R._m;
  var mL=L._m||{},mR=R._m||{};
  var fbL=Number(L._syncUpdatedAt||0),fbR=Number(R._syncUpdatedAt||0);
  var has=Object.prototype.hasOwnProperty;
  var seen={},order=[];
  [Object.keys(aL),Object.keys(aR),Object.keys(mL),Object.keys(mR)].forEach(function(ks){
    ks.forEach(function(k){if(!seen[k]){seen[k]=1;order.push(k)}});
  });
  var out={},M={},cut=Date.now()-90*86400000;
  order.forEach(function(id){
    var hl=has.call(aL,id),hr=has.call(aR,id);
    var tl=mL[id]!=null?Number(mL[id]):((legL&&hl)?fbL:0);
    var tr=mR[id]!=null?Number(mR[id]):((legR&&hr)?fbR:0);
    var useR;
    if(tr!==tl)useR=tr>tl;
    else if(hl&&hr)useR=aR[id]>aL[id];
    else useR=hr;
    if(useR){if(hr)out[id]=aR[id]}else{if(hl)out[id]=aL[id]}
    var t=Math.max(tl,tr);
    if(t>0&&(has.call(out,id)||t>cut))M[id]=t;
  });
  var res={students:[],fin:[],tasks:[],notes:[],ex:[],reports:[],att:{},reminded:{},remindDay:{},reportSent:{},dayOverrides:{},todayDoneOrder:{},theme:{},hide:{},accounting:{month:'',logs:[]}};
  Object.keys(out).forEach(function(id){
    var p=id.indexOf(':',2),t=id.charAt(0),name=p<0?id.slice(2):id.slice(2,p),rest=p<0?'':id.slice(p+1),v=out[id];
    try{
      if(t==='a'){
        if(name==='accounting.logs')res.accounting.logs.push(JSON.parse(v));
        else res[name].push(JSON.parse(v));
      }else if(t==='m'){res[name][rest]=JSON.parse(v)}
      else if(t==='s'){var q=rest.indexOf(':'),d=rest.slice(0,q),mb=rest.slice(q+1);(res.hide[d]=res.hide[d]||[]).push(mb)}
      else if(t==='k'){
        if(name==='accounting'){var o=JSON.parse(v);Object.keys(o).forEach(function(z){res.accounting[z]=o[z]})}
        else res[name]=JSON.parse(v);
      }
    }catch(e){}
  });
  res._m=M;
  return res;
}

/* ---------- وسم التغييرات بالطابع الزمني لكل سجل ---------- */
function idaraStamp(S,SNAP,hashFn,now,silent,legacyTs){
  var A=idaraAtoms(S),H={},m=S._m||(S._m={}),n=0,id;
  Object.keys(A).forEach(function(k){H[k]=hashFn(A[k])});
  if(!SNAP){
    Object.keys(A).forEach(function(k){if(m[k]==null){m[k]=legacyTs||1;n++}});
  }else{
    Object.keys(A).forEach(function(k){
      if(SNAP[k]!==H[k]){
        n++;
        if(!silent)m[k]=Math.max(now,(+m[k]||0)+1);
        else if(m[k]==null&&SNAP[k]===undefined)m[k]=0;
      }
    });
    Object.keys(SNAP).forEach(function(k){
      if(!(k in A)){n++;m[k]=Math.max(now,(+m[k]||0)+1)}
    });
  }
  return {hashes:H,changed:n};
}

const GS=`/************************************************************

function doGet(e) {
  var p = (e && e.parameter) || {};
  var props = PropertiesService.getScriptProperties();
  var m = {};
  try { m = JSON.parse(props.getProperty('APP_META') || '{}'); } catch (err) { m = {}; }
  if (p.status) {
    return jsonOut({ok:true, v:'r2', lastWrite:Number(props.getProperty('LAST_WRITE') || 0), err:String(props.getProperty('LAST_EXPORT_ERROR') || ''), now:new Date().getTime()});
  }
  if (p.ver && m && m.ts) {
    return jsonOut({ok:true, ver:true, srv:2, exists:true, stateTs:m.ts, device:m.dev, rev:Number(m.rev || 0), acks:m.acks || {}, now:new Date().getTime()});
  }
  var lock = LockService.getScriptLock();
  var locked = false;
  try { lock.waitLock(10000); locked = true; } catch (err) { locked = false; }
  var raw = '';
  try { raw = readStateRaw(); } finally { if (locked) { try { lock.releaseLock(); } catch (ig) {} } }
  var state = null;
  if (raw) { try { state = JSON.parse(raw); } catch (err) { state = null; } }
  if (!state) return jsonOut({ok:true, mode:'sync', srv:2, exists:false, state:null, rev:Number(m.rev || 0), ts:new Date().getTime()});
  return jsonOut({ok:true, mode:'sync', srv:2, exists:true, state:state, rev:Number(m.rev || 0), ts:new Date().getTime()});
}

function doPost(e) {
  var body = {};
  try { body = JSON.parse(e.postData.contents); } catch (err) { body = {}; }
  if (body && body.ping) return jsonOut({ok:true, mode:'sync', srv:2, ts:new Date().getTime()});
  if (!body || typeof body !== 'object' || !Object.keys(body).length) return jsonOut({ok:false, error:'bad body'});

  // قفل واحد: كل عملية حفظ تُنفَّذ بالدور، وتُدمج مع آخر حالة محفوظة بدل أن تكتب فوقها.
  var lock = LockService.getScriptLock();
  try { lock.waitLock(30000); } catch (err) { return jsonOut({ok:false, busy:true}); }
  var rev = 0;
  var changed = false;
  try {
    var props = PropertiesService.getScriptProperties();
    var meta = {};
    try { meta = JSON.parse(props.getProperty('APP_META') || '{}'); } catch (ig) { meta = {}; }
    var incomingTs = Number(body._syncUpdatedAt || body.ts || 0);
    var dev = String(body._syncDevice || '');
    var lean = {};
    Object.keys(body).forEach(function(k){ if (k !== 'exportSheets') lean[k] = body[k]; });
    var stored = null;
    var raw = readStateRaw();
    if (raw) { try { stored = JSON.parse(raw); } catch (ig) { stored = null; } }

    var merged = JSON.parse(JSON.stringify(lean)); /* الشيت مرآة لما في البرنامج: آخر إرسال هو المعتمد */
    merged._syncUpdatedAt = Math.max(Number((stored && stored._syncUpdatedAt) || 0), incomingTs);
    merged._syncDevice = dev;
    merged.ts = merged._syncUpdatedAt;

    var sigMerged = idaraSig(merged);
    changed = !stored || idaraSig(stored) !== sigMerged;
    var sameAsIncoming = true;

    // 1) احفظ الحالة المدموجة أولًا.
    writeStateRaw(JSON.stringify(merged));
    rev = Number(meta.rev || 0) + (changed ? 1 : 0);
    meta.rev = rev;
    meta.ts = Math.max(Number(meta.ts || 0), merged._syncUpdatedAt);
    meta.dev = dev;
    meta.acks = meta.acks || {};
    meta.acks[dev] = incomingTs;
    var ak = Object.keys(meta.acks);
    if (ak.length > 20) { ak.slice(0, ak.length - 20).forEach(function(k){ delete meta.acks[k]; }); }
    props.setProperty('APP_META', JSON.stringify(meta));
    try { props.deleteProperty('APP_STATE'); } catch (ignore) {}

    // 2) حدّث أوراق العرض فقط إذا كانت نسخة الجهاز هي نفسها الحالة المدموجة،
    //    وإلا فالجهاز سيسحب الدمج ويعيد الإرسال فتُبنى الأوراق من حالة كاملة.
    try { if (sameAsIncoming) { writeAll(body); props.setProperty('LAST_WRITE', String(new Date().getTime())); props.deleteProperty('LAST_EXPORT_ERROR'); } } catch (err) {
      props.setProperty('LAST_EXPORT_ERROR', String(err && err.message ? err.message : err).slice(0, 500));
    }
  } finally {
    lock.releaseLock();
  }
  return jsonOut({ok:true, mode:'sync', srv:2, accepted:true, changed:changed, rev:rev, ts:new Date().getTime()});
}

function jsonOut(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}

function getSheet(name) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var s = ss.getSheetByName(name);
  if (!s) s = ss.insertSheet(name);
  s.setRightToLeft(true);
  return s;
}

function normalizeLegacySheets() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  // حذف ورقة «الإضافيات / عمليات السيستم» نهائيًا من الشيت المرتبط
  var removedExtras = ss.getSheetByName('الإضافيات / عمليات السيستم');
  if (removedExtras && ss.getSheets().length > 1) ss.deleteSheet(removedExtras);
  var pairs = [
    ['التقارير', SHEETS.reports],
    ['الاستثنائية', SHEETS.daily],
    ['المواعيد الاستثنائية', SHEETS.daily],
    ['المهام', SHEETS.tasks]
  ];
  pairs.forEach(function(pair){
    var oldName = pair[0], newName = pair[1];
    var oldSheet = ss.getSheetByName(oldName);
    var newSheet = ss.getSheetByName(newName);
    if (oldSheet && !newSheet) {
      oldSheet.setName(newName);
    } else if (oldSheet && newSheet && oldName !== newName) {
      ss.deleteSheet(oldSheet);
    }
  });
}

function orderSheets() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  SHEET_ORDER.forEach(function(name, i){
    var sh = getSheet(name);
    sh.activate();
    ss.moveActiveSheet(i + 1);
  });
}

function num(v) {
  var raw = String(v == null ? '' : v)
    .replace(/[٠-٩]/g, function(c){ return '٠١٢٣٤٥٦٧٨٩'.indexOf(c); })
    .replace(/[۰-۹]/g, function(c){ return '۰۱۲۳۴۵۶۷۸۹'.indexOf(c); })
    .replace(/,/g, '');
  var n = parseFloat(raw.replace(/[^\d.\-]/g, ''));
  return isNaN(n) ? 0 : n;
}

function numFromKeys(obj, keys) {
  obj = obj || {};
  var fallback = 0;
  for (var i = 0; i < keys.length; i++) {
    var v = obj[keys[i]];
    if (v === undefined || v === null || String(v).trim() === '') continue;
    var n = num(v);
    if (n > 0) return n;
    fallback = n;
  }
  return fallback;
}

function textFromKeys(obj, keys, def) {
  obj = obj || {};
  for (var i = 0; i < keys.length; i++) {
    var v = obj[keys[i]];
    if (v !== undefined && v !== null && String(v).trim() !== '') return String(v);
  }
  return def || '';
}

function pad2(n) { return ('0' + Number(n)).slice(-2); }

function parseJSON(v, def) {
  if (v && typeof v === 'object') return v;
  try { return JSON.parse(v); } catch (e) { return def; }
}

function daysText(days) {
  var out = [];
  days = days || {};
  for (var d in days) {
    if (!days.hasOwnProperty(d)) continue;
    var z = days[d] || {};
    out.push(d + ' من ' + (z.f || '') + ' إلى ' + (z.t || ''));
  }
  return out.join('، ');
}

}

function time12(value) {
  var m = String(value || '').match(/^(\d{1,2}):(\d{2})$/);
  if (!m) return '';
  var h = Number(m[1]), mi = Number(m[2]);
  var suffix = h >= 12 ? 'م' : 'ص';
  h = h % 12 || 12;
  return pad2(h) + ':' + pad2(mi) + ' ' + suffix;
}

function timeMinutes(value) {
  var m = String(value || '').match(/^(\d{1,2}):(\d{2})$/);
  return m ? Number(m[1]) * 60 + Number(m[2]) : 9999;
}

function effectiveDuration(student, overrideDuration) {
  if (String(student && student.status || '').trim() === 'تجريبي') return 30;
  var n = Number(overrideDuration || (student && student.dur) || 0);
  return n > 0 ? n : 0;
}

function scheduledTime(student, date) {
  var d = arabicDay(date), z = (student && student.days || {})[d];
  return z && z.f ? String(z.f) : '';
}

    .setFontWeight('bold')

    .setFontColor('#17324D');

  if (s.getName() === SHEETS.schedule && rows > 1 && cols >= 5) {

function writeSheet(name, headers, rows) {
  var s = getSheet(name);
  s.clear();

  // رأس واحد فقط: إذا وصلتنا رؤوس مكررة من التصدير، احذفها من بداية البيانات.
  var cleanRows = (rows || []).slice();
  while (cleanRows.length && JSON.stringify(cleanRows[0]) === JSON.stringify(headers)) {
    cleanRows.shift();
  }
  // كما نتعامل مع اختلاف بسيط في الأنواع/المسافات عند تكرار الرأس.
  while (cleanRows.length) {
    var first = cleanRows[0];
    var sameHeader = Array.isArray(first) && first.length === headers.length && first.every(function(v, i){
      return String(v == null ? '' : v).trim() === String(headers[i] == null ? '' : headers[i]).trim();
    });
    if (!sameHeader) break;
    cleanRows.shift();
  }

  s.getRange(1, 1, 1, headers.length).setValues([headers]);
  if (cleanRows.length) s.getRange(2, 1, cleanRows.length, headers.length).setValues(cleanRows);
  styleSheet(s, cleanRows.length + 1, headers.length);
}

function buildAttendanceStats(data) {
  var ym = currentMonth(), students = data.students || [], att = data.att || {};
  var byId = {}, counts = {}, stats = {};
  students.forEach(function(s){ byId[String(s.id || '')] = s; });

  Object.keys(att).forEach(function(k){
    var parts = String(k).split('|'), date = parts[0], marker = parts.slice(1).join('|');
    if (String(date).slice(0,7) !== ym) return;
    var sid = String(att[k] || ''), s = byId[sid];
    if (!s) return;
    if (s.resetAt && String(date) < String(s.resetAt)) return;
    var dur = numFromKeys(s, ['dur','duration','lessonDuration','lesson_duration']);
    if (String(s.status || '').trim() === 'تجريبي') dur = 30;
    if (marker.indexOf('x') === 0) {
      var x = (data.ex || []).find(function(z){ return String(z.id) === marker.slice(1); });
      if (x) dur = effectiveDuration(s, numFromKeys(x, ['dur','duration','lessonDuration']) || dur);
    }
    var rate = numFromKeys(s, ['rate','hourRate','hour_rate','ratePerHour']);
    var amt = dur / 60 * rate;
    if (!stats[sid]) stats[sid] = {n:0, h:0, amt:0};
    stats[sid].n += 1;
    stats[sid].h += dur / 60;
    stats[sid].amt += amt;
  });

  return students.map(function(s){
    var a = stats[String(s.id || '')] || {n:0,h:0,amt:0};
    var lessons = numFromKeys(s, ['lessons','monthlyLessons','monthly_lessons','lessonCount']);
    var adj = num(s.adj);
    var dur = numFromKeys(s, ['dur','duration','lessonDuration','lesson_duration']);
    var rate = numFromKeys(s, ['rate','hourRate','hour_rate','ratePerHour']);
    if (String(s.status || '').trim() === 'تجريبي') dur = 30;
    var accountDone = Math.max(0, a.n + adj);
    var accountHours = a.h + Math.max(0, adj) * dur / 60;
    var accountAmt = a.amt + Math.max(0, adj) * dur / 60 * rate;
    var remaining = Math.max(0, lessons - accountDone);
    var roundNo = 0; if (String(s.academy || '').trim() === 'خاص' && lessons > 0) roundNo = Math.floor(accountDone / lessons) + 1; return [s.name || '', accountDone, accountHours, accountAmt, s.status || 'يدرس', roundNo ? ('Round ' + roundNo) : '', remaining];
  });
}

function buildDailyAttendance(data) {
  var students = data.students || [], att = data.att || {}, ex = data.ex || [];
  var byId = {}, exById = {}, countByStudent = {}, rows = [];
  students.forEach(function(s){ byId[String(s.id || '')] = s; countByStudent[String(s.id || '')] = 0; });
  ex.forEach(function(x){ exById[String(x.id || '')] = x; });

  Object.keys(att).forEach(function(k){
    var parts = String(k).split('|'), date = parts[0], marker = parts.slice(1).join('|');
    var sid = String(att[k] || ''), s = byId[sid];
    if (!s || !date) return;
    if (s.resetAt && String(date) < String(s.resetAt)) return;

    var x = marker.indexOf('x') === 0 ? exById[marker.slice(1)] : null;
    var rawTime = x && x.time ? String(x.time) : scheduledTime(s, date);
    var dur = effectiveDuration(s, x ? numFromKeys(x, ['dur','duration','lessonDuration']) : 0);
    if (String(s.status || '').trim() === 'تجريبي') dur = 30;
    countByStudent[sid] = (countByStudent[sid] || 0) + 1;
    rows.push({
      date: String(date),
      name: s.name || '',
      rawTime: rawTime,
      time: time12(rawTime),
      dur: dur,
      academy: s.academy || '',
      status: 'حضور',
      sid: sid
    });
  });

  rows.sort(function(a,b){
    return String(b.date).localeCompare(String(a.date)) || timeMinutes(a.rawTime) - timeMinutes(b.rawTime) || a.name.localeCompare(b.name);
  });

  return rows.map(function(r){
    var s = byId[r.sid] || {};
    var completed = (countByStudent[r.sid] || 0) + num(s.adj);
    var lessons = numFromKeys(s, ['lessons','monthlyLessons','monthly_lessons','lessonCount']);
    var remaining = Math.max(0, lessons - completed);
    return [r.date, r.name, r.time, r.dur, r.academy, r.status, remaining];
  });
}

var STATE_SHEET = '_APP_STATE';
var STATE_CHUNK = 40000;

function stateSheet() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var s = ss.getSheetByName(STATE_SHEET);
  if (!s) { s = ss.insertSheet(STATE_SHEET); s.hideSheet(); }
  return s;
}

function readStateRaw() {
  var s = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(STATE_SHEET);
  if (s) {
    var n = s.getLastRow();
    if (n > 0) {
      var vals = s.getRange(1, 1, n, 1).getValues();
      var out = [];
      for (var i = 0; i < vals.length; i++) out.push(String(vals[i][0] == null ? '' : vals[i][0]).slice(1));
      var raw = out.join('');
      if (raw) return raw;
    }
  }
  return PropertiesService.getScriptProperties().getProperty('APP_STATE') || '';
}

function writeStateRaw(raw) {
  var s = stateSheet();
  var rows = [];
  for (var i = 0; i < raw.length; i += STATE_CHUNK) rows.push(['J' + raw.substr(i, STATE_CHUNK)]);
  if (!rows.length) rows.push(['J']);
  s.clearContents();
  s.getRange(1, 1, rows.length, 1).setValues(rows);
  SpreadsheetApp.flush();
}

function writeAll(d) {
  if (!d) return;
  normalizeLegacySheets();

  // المصدر الحاسم للتصدير هو الجدول الجاهز الذي يبنيه البرنامج نفسه.
  // هذا يمنع أي إعادة تفسير للقيم مثل مدة الحلقة أو سعر الساعة أو عدد الحلقات.
  if (d.exportSheets) {
    function rowsOnly(name, headers) {
      var rows = d.exportSheets[name] || [];
      // البرنامج يبني المصفوفة ومعها رأس الجدول لاستخدام Excel،
      // أما Google Sheets فيكتب الرأس مرة واحدة فقط عبر writeSheet.
      if (rows.length && headers.length && JSON.stringify(rows[0]) === JSON.stringify(headers)) rows = rows.slice(1);
      return rows;
    }
    writeSheet(SHEETS.schedule, HEADERS.schedule, rowsOnly('جدول المواعيد', HEADERS.schedule));

    writeSheet(SHEETS.fin, HEADERS.fin, rowsOnly('المالية', HEADERS.fin));
    writeSheet(SHEETS.tasks, HEADERS.tasks, rowsOnly(SHEETS.tasks, HEADERS.tasks));
    writeSheet(SHEETS.rounds, HEADERS.rounds, rowsOnly('راوندات الطلاب', HEADERS.rounds));
    orderSheets();
    return;
  }

  var students = d.students || [], byId = {};
  students.forEach(function(s){ byId[String(s.id || '')] = s; });

  writeSheet(SHEETS.att, HEADERS.att, buildAttendanceStats(d));
  writeSheet(SHEETS.daily, HEADERS.daily, buildDailyAttendance(d));

  var studentRows = students.map(function(s){

      numFromKeys(s, ['dur','duration','lessonDuration','lesson_duration']),
      numFromKeys(s, ['rate','hourRate','hour_rate','ratePerHour']),
      numFromKeys(s, ['lessons','monthlyLessons','monthly_lessons','lessonCount']),
      s.status || 'يدرس', (s.status === 'موقوف' ? (s.statusReason || s.statusNote || '') : ''), s.groupLink || '', s.link || ''];
  });
  writeSheet(SHEETS.students, HEADERS.students, studentRows);

  var reportRows = (d.reports || []).filter(function(r){ return String(r.kind || 'report') === 'report'; }).map(function(r){var st = byId[String(r.sid || '')];return [r.date || '', st ? st.name : (r.name || ''), r.text || ''];});
  writeSheet(SHEETS.reports, HEADERS.reports, reportRows);

  var finRows = (d.fin || []).filter(function(f){ return !f.auto; }).map(function(f){var st = byId[String(f.sid || '')];return [f.date || '', st ? st.name : (f.name || ''), f.type || 'محصّل', numFromKeys(f, ['amt','amount','value','money','total','المبلغ']), f.note || ''];});
  writeSheet(SHEETS.fin, HEADERS.fin, finRows);

  var tz = Session.getScriptTimeZone() || 'Africa/Cairo';
  function noteStamp(v){ if(!v) return ''; var dt=new Date(v); return isNaN(dt.getTime())?'':Utilities.formatDate(dt,tz,'yyyy-MM-dd HH:mm'); }
  var taskRows = (d.tasks || []).map(function(t){ var ds=t.upd ? Utilities.formatDate(new Date(t.upd), tz, 'yyyy-MM-dd') : ''; return ['مهمة', t.t || '', t.d ? 'مكتملة' : 'غير مكتملة', '', '', ds ? ('يوم ' + arabicDay(ds) + ' ' + ds) : '', '']; });
  var noteRows = (d.notes || []).map(function(n){ return ['ملاحظة', n.title || '', '', n.text || '', noteStamp(n.createdAt), noteStamp(n.updatedAt), n.reminder || '']; });
  writeSheet(SHEETS.tasks, HEADERS.tasks, taskRows.concat(noteRows));

  orderSheets();
}

function normalizeRangeDate(v,end){const s=String(v||'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;if(/^\d{4}-\d{2}$/.test(s)){const [y,m]=s.split('-').map(Number);if(end){const d=new Date(y,m,0).getDate();return y+'-'+pad(m)+'-'+pad(d)}return s+'-01'}return ''}
function dateLabel(v){const s=normalizeRangeDate(v,false);if(!s)return '';const [y,m,d]=s.split('-');return d+'-'+m+'-'+y}
function dateRangeText(a,b){const from=normalizeRangeDate(a,false),to=normalizeRangeDate(b,true);if(!from&&!to)return 'كل التواريخ';if(from&&to)return 'من '+dateLabel(from)+' إلى '+dateLabel(to);if(from)return 'من '+dateLabel(from);return 'إلى '+dateLabel(to)}
function monthRangeText(a,b){if(!a&&!b)return 'كل الشهور';return 'من '+monthLabel(a||b)+' إلى '+monthLabel(b||a)}

/* تنسيق ثنائي الاتجاه لسعر الساعة وقيمة الاشتراك */
calcForm=function(source){
  if(!$('#fp'))return;
  const d=+($('#fd')?.value||0), l=+($('#fl')?.value||0), total=(d/60)*l;
  let r=+($('#fr')?.value||0), v=+($('#fv')?.value||0);
  if(source==='fv' && v>0 && total>0){r=v/total;$('#fr').value=String(Number(r.toFixed(4)))}
  else if(source==='fr' && r>0 && total>0){v=r*total;$('#fv').value=String(Number(v.toFixed(2)))}
  else if((source==='fd'||source==='fl') && total>0){
    const basis=$('#fv')?.dataset.calcSource||'fr';
    if(basis==='fv' && v>0){r=v/total;$('#fr').value=String(Number(r.toFixed(4)))}
    else if(r>0){v=r*total;$('#fv').value=String(Number(v.toFixed(2)))}
  } else if(!source && total>0){
    if(v>0 && r<=0){r=v/total;$('#fr').value=String(Number(r.toFixed(4)))}
    else if(r>0){v=r*total;$('#fv').value=String(Number(v.toFixed(2)))}
  }
  if($('#fv'))$('#fv').dataset.calcSource=source||$('#fv').dataset.calcSource||(v>0&&r<=0?'fv':'fr');
  $('#fp').value=(d>0&&r>0)?fm((d/60)*r)+' جنيه':'';
};

/* حفظ بيانات الطالب من نافذة شاشة اليوم، مع البقاء في الشاشة الحالية */
function saveStudentInline(old,options){
  options=options||{};
  if(old){const live=S.students.find(x=>x.id===old.id);if(live)old=live}
  const root=$('#dbody')||document,q=sel=>root.querySelector(sel)||$(sel),name=(q('#fn')?.value||'').trim(),days={};

  const rawDur=+(q('#fd')?.value??45),dur=rawDur>0?rawDur:45,stepDur=dur>0?dur:45;

    const c=root.querySelector(`input[data-d="${d}"]`)||document.querySelector(`input[data-d="${d}"]`),df=tget('f'+i),dt=tget('t'+i);
    if((c&&c.checked)||df||dt){
      let f=df||tget('cf'), t=dt||tget('ct');
      if(f&&!t)t=hm(Math.min(1439,tmn(f)+stepDur));
      else if(!f&&t)f=hm(Math.max(0,tmn(t)-stepDur));
      else if(!f&&!t){f='16:00';t=hm(Math.min(1439,tmn(f)+stepDur))}
      if(tmn(t)<=tmn(f)){if(tmn(f)>=720&&tmn(t)<720&&tmn(t)+720>tmn(f)&&tmn(t)+720<=1439)t=hm(tmn(t)+720);else t=hm(Math.min(1439,tmn(f)+stepDur))}
      days[d]={f,t};
    }
  });

(function(){

  const NS='http://www.w3.org/2000/svg';
  function makeIcon(kind){
    const span=document.createElement('span');

    span.setAttribute('aria-hidden','true');
    const svg=document.createElementNS(NS,'svg');

      const bell=document.createElementNS(NS,'path');

      svg.appendChild(bell); svg.appendChild(clapper);

      page.setAttribute('d','M6 3.5h8l4 4V20.5H6z');

  function decorate(){

  decorate();

  }
})();

(function(){
  /* نترك منطق الأحداث والحفظ السابق كما هو، ونضبط العرض النهائي فقط حسب حالة الزر. */
  function normalizeButton(btn){

    const icon=btn.querySelector('.day-ui-icon');
    if(sent){
      if(icon) icon.style.display='none';
      btn.setAttribute('data-ui-complete','1');
      if(btn.classList.contains('rem-sent')) btn.lastChild && (btn.lastChild.nodeValue='تم التذكير');
      if(btn.classList.contains('report-sent')) btn.lastChild && (btn.lastChild.nodeValue='تم التقرير');
    }else{
      btn.removeAttribute('data-ui-complete');
    }
  }
  function normalizeAll(){
    document.querySelectorAll('.tcard .t-actions .repbtn.rembtn, .tcard .t-actions .repbtn:not(.rembtn)').forEach(normalizeButton);
  }
  normalizeAll();
  const root=document.body;

    let scheduled=false;
    const obs=new MutationObserver(function(){

})();

(function(){
  /* لا نحذف دوال العرض السابقة؛ نغلفها ونضيف طبقة الحالة المطلوبة فقط. */
  function reminderPendingCount(){
    try{
      return lessonsOn(TD()).filter(function(l){
        return String(l.s.academy||'').trim()==='خاص' && !S.reminded[TD()+'|'+l.key];
      }).length;
    }catch(e){ return 0; }
  }

  function reportPendingCount(){
    try{
      /* التقرير مطلوب لكل حلقة اليوم، ويبقى العدد حتى يتم إرسال التقرير. */
      return lessonsOn(TD()).filter(function(l){
        return !reportWasSent(l.s.id,TD());
      }).length;
    }catch(e){ return 0; }
  }

  function badgeHtml(kind,count){
    if(!(count>0))return '';
    var bell='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path><path d="M10 21h4"></path></svg>';
    var doc='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h8l4 4V20.5H6z"></path><path d="M14 3.5v4h4"></path><path d="M9 12h6M9 15.5h6"></path></svg>';
    var title=kind==='reminder'?'تذكيرات الحلقة المتبقية':'تقارير الطلاب المتبقية';
    return '<span class="today-notify '+kind+'" title="'+title+'" aria-label="'+title+': '+count+'">'+
      '<span class="notify-icon">'+(kind==='reminder'?bell:doc)+'</span>'+
      '<span class="notify-badge">'+count+'</span></span>';
  }

  if(typeof VW!=='undefined' && typeof VW.today==='function' && !VW.__v23TodayWrapped){
    var oldToday=VW.today;
    VW.today=function(){
      var html=oldToday();
      var rc=reminderPendingCount(), pc=reportPendingCount();
      var badges='<span class="today-notify-stats">'+badgeHtml('reminder',rc)+badgeHtml('report',pc)+'</span>';
      var marker='<span class="today-title-stats">';
      if(html.indexOf(marker)>=0) html=html.replace(marker,marker+badges);
      else{
        var h='</h1>';
        if(html.indexOf(h)>=0) html=html.replace(h,h+badges);
      }
      return html;
    };
    VW.__v23TodayWrapped=true;
  }

  if(typeof VW!=='undefined' && typeof VW.reps==='function' && !VW.__v23RepsWrapped){
    var oldReps=VW.reps;
    VW.reps=function(){
      var q=(V.rq||'').trim();
      var rows=[];

      /* التقارير المحفوظة فعلياً: المرسل/غير المرسل بحسب حالة اليوم/التاريخ. */
      var actual=S.reports.map(function(r,idx){return {r:r,idx:idx}}).filter(function(x){
        var r=x.r;
        return (r.kind||'report')==='report' && !reminderLike(r.text);
      }).filter(function(x){
        var r=x.r,ss=stu(r.sid);
        return !q || (ss&&wm(ss.name,q)) || wm(r.text,q);
      });

      actual.forEach(function(x){
        var r=x.r;
        var doneRank=1e9;
        if(String(r.date)===String(TD())){
          var ord=(S.todayDoneOrder && S.todayDoneOrder[TD()])||[];
          var lessonKey=String(r.sid||'');
          var direct=ord.indexOf(lessonKey);
          if(direct!==-1) doneRank=direct;
          else if(typeof lessonsOn==='function'){
            var ll=lessonsOn(TD()).find(function(z){return z.s && z.s.id===r.sid;});
            if(ll){var rr=ord.indexOf(ll.key); if(rr!==-1) doneRank=rr;}
          }
        }
        rows.push({
          kind:'actual', id:r.id, sid:r.sid, date:r.date, idx:x.idx,
          doneRank:doneRank,
          sent:reportWasSent(r.sid,r.date),
          name:(stu(r.sid)?stu(r.sid).name:'—')
        });
      });

      /* طلاب اليوم الذين أتموا الحلقة ولم يرسلوا التقرير بعد، حتى لو لم يوجد سجل تقرير. */
      var pendingToday=lessonsOn(TD()).filter(function(l){
        return !!S.att[TD()+'|'+l.key] && !reportWasSent(l.s.id,TD());
      });
      pendingToday.forEach(function(l){
        if(q && !wm(l.s.name,q))return;
        var exists=actual.some(function(r){return r.sid===l.s.id && r.date===TD()});
        if(!exists){
          rows.push({
            kind:'pending', id:'pending|'+l.s.id+'|'+TD(), sid:l.s.id, date:TD(),
            idx:1e15 + Math.max(0,(S.todayDoneOrder[TD()]||[]).indexOf(l.key)),
            doneRank:Math.max(0,(S.todayDoneOrder[TD()]||[]).indexOf(l.key)),
            key:l.key, sent:false, name:l.s.name
          });
        }
      });

      /* الأحدث إنجازاً أولاً: في تقارير اليوم نعتمد ترتيب إتمام الحلقة نفسه، حيث 0 = أحدث إنجاز. */
      rows.sort(function(a,b){
        var at=String(a.date)===String(TD()), bt=String(b.date)===String(TD());
        if(at!==bt) return at ? -1 : 1;
        if(at && bt){
          var ar=Number(a.doneRank==null?1e9:a.doneRank), br=Number(b.doneRank==null?1e9:b.doneRank);
          if(ar!==br) return ar-br;
        }
        return (Number(b.idx||0)-Number(a.idx||0)) || String(b.date).localeCompare(String(a.date)) || String(a.name).localeCompare(String(b.name));
      });

      var totalReports=S.reports.filter(function(r){return (r.kind||'report')==='report'&&!reminderLike(r.text)}).length;
      var headHtml=head('تقارير الحلقات','','<span style="display:flex;gap:8px;flex-wrap:wrap"><div class="chip2">عدد التقارير <b>'+totalReports+'</b></div></span>');
      var search='<div class="sbox"><div><label>بحث سريع في التقارير</label><span class="sx-wrap"><input data-c="rq" value="'+esc(q)+'" placeholder="ابحث باسم الطالب أو بنص التقرير">'+sxBtn()+'</span></div></div>';

      if(!rows.length){
        return headHtml+search+empty(q?'لا نتائج مطابقة للبحث.':'لا توجد تقارير محفوظة بعد. تُحفظ التقارير من زر «تقرير الطالب» في شاشة اليوم.');
      }

      var body='<div class="card" style="padding:0">'+rows.map(function(r){
        var btn;
        if(r.sent){
          btn='<button class="repbtn report-sent" type="button" data-a="repedit" data-i="'+esc(r.id)+'">مرسل</button>';
        }else if(r.kind==='pending'){
          btn='<button class="repbtn report-pending" type="button" data-a="reppending" data-k="'+esc(r.key)+'">إرسال التقرير</button>';
        }else{
          btn='<button class="repbtn report-pending" type="button" data-a="repedit" data-i="'+esc(r.id)+'">إرسال التقرير</button>';
        }
        var del=r.kind==='actual'?'<button class="btn d sm report-delete-icon" type="button" data-a="repdel" data-i="'+esc(r.id)+'" aria-label="حذف التقرير" title="حذف التقرير"><svg class="ico" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M9 6V4h6v2M19 6l-1 14H6L5 6M10 10v6M14 10v6"/></svg></button>':'';
        return '<div class="rrow"><div class="nmr">'+esc(r.name)+'<div class="mu">'+esc(r.date)+'</div></div>'+btn+del+'</div>';
      }).join('')+'</div>';
      return headHtml+search+body;
    };
    VW.__v23RepsWrapped=true;
  }

  /* زر إرسال التقرير من صف طالب أتم الحلقة بلا تقرير محفوظ. */
  if(typeof A!=='undefined' && !A.reppending){
    A.reppending=function(e){
      var k=e.dataset.k, l=lessonsOn(TD()).find(function(x){return x.key===k});
      if(!l){toast('تعذر تحديد الطالب');return}
      /* نعيد استخدام نافذة التقرير الأصلية ودالة الإرسال السابقة دون تغييرها. */
      A.rep({dataset:{k:k}});
    };
  }

  /* نضبط زر «مرسل» في أي صف موجود من النسخة السابقة أيضاً. */
  function normalizeReportRows(){
    document.querySelectorAll('.rrow .repbtn').forEach(function(btn){
      if(btn.classList.contains('report-sent')){
        btn.textContent='مرسل';
      }else if(btn.classList.contains('report-pending')){
        btn.textContent='إرسال التقرير';
      }
    });
  }

  normalizeReportRows();
  if(typeof render==='function'){
    render();
    requestAnimationFrame(normalizeReportRows);
  }
})();

      VW.acc=wrapped;
    }catch(e){}
  }
  addAccountsBadge();

  /* إرسال تذكير الراوند: يستخدم رابط واتساب المحفوظ للطالب والنص الافتراضي الحالي */
  function roundReminderTime(s){
    try{
      var z=effectiveDaySlot(TD(),s); if(z&&z.f)return z.f;
    }catch(e){}
    try{
      var v=Object.values(s.days||{}); if(v.length&&v[0]&&v[0].f)return v[0].f;
    }catch(e){}
    return '';
  }
  function roundWhatsAppUrl(link,text){
    link=String(link||'').trim();
    if(!link)return '';
    var sep=link.indexOf('?')>=0?'&':'?';
    return link+sep+'text='+encodeURIComponent(text||'');
  }
  function roundReminder(e){
    var s=stu(e.dataset.i),ri=Math.max(0,Math.floor(+e.dataset.r||0));
    if(!s||!isPrivateStudent(s))return;
    var link=String(s.groupLink||'').trim();
    if(!link){
      try{link=String(academyGroupLink(s)||'').trim()}catch(x){}
    }
    var time=roundReminderTime(s),day=dayOf(TD()),date=TD();
    var baseText=(s.remindTemplate||privateRoundReminderDefault(s));
    var preview=fillTmpl(baseText,s,day,time,date);
    modal('تذكير الراوند — '+esc(s.name),
      '<div class="mu" style="margin-bottom:10px">الراوند: <b>'+(ri+1)+'</b></div>'+
      '<label>رابط واتساب من قاعدة البيانات</label><input id="rrmg" dir="ltr" value="'+esc(link)+'" readonly>'+
      '<label style="margin-top:14px">رسالة التذكير</label><textarea id="rrmtx" rows="9" class="rep">'+esc(preview)+'</textarea>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button type="button" class="btn o sm" data-a="roundReminderSave" data-i="'+s.id+'">حفظ النص كقالب</button><button type="button" class="btn o sm" data-a="roundReminderDefault" data-i="'+s.id+'">الافتراضي</button></div>'+
      '<div class="mu" style="margin-top:8px">يمكنك تعديل الرسالة قبل الإرسال.</div>',
      function(){
        var body=$('#rrmtx')?$('#rrmtx').value.trim():'';
        var gl=$('#rrmg')?$('#rrmg').value.trim():link;
        if(!body){toast('اكتب رسالة التذكير أولًا');return false}
        if(!gl){toast('لا يوجد رابط واتساب محفوظ لهذا الطالب');return false}
        if(gl.indexOf('chat.whatsapp.com')<0){
          window.open(roundWhatsAppUrl(gl,body),'_blank');
        }else{
          /* روابط المجموعات لا تدعم تمرير نص آليًا؛ نفتح المجموعة مع إبقاء النص جاهزًا للنسخ */
          copy(body).then(function(){window.open(gl,'_blank');toast('تم نسخ رسالة التذكير وفتح رابط واتساب')});
          return true;
        }
        toast('تم فتح واتساب برسالة التذكير');return true;
      },'إرسال');
  }

  if(typeof A!=='undefined'){
    A.roundAlertBack=function(){roundDueStudentsModal()};
    A.roundReminder=roundReminder;
    A.roundReminderSave=function(e){
      var s=stu(e.dataset.i),t=$('#rrmtx')?$('#rrmtx').value.trim():'';

    };
    A.roundReminderDefault=function(e){
      var s=stu(e.dataset.i);if(!s)return;
      var t=fillTmpl(privateRoundReminderDefault(s),s,dayOf(TD()),roundReminderTime(s),TD());
      var el=$('#rrmtx');if(el)el.value=t;
    };
  }

  /* تحديث الشارة فورًا بعد دفع الراوند أو أي تغيير */
  if(typeof render==='function' && !render.__finalRoundBadgeRefresh){
    var oldRender=render;

    wrappedRender.__finalRoundBadgeRefresh=true;
    render=wrappedRender;
  }
})();

(function(){
  'use strict';

  function restoreExceptionalButtons(){
    try{
      var app=document.querySelector('#app');
      if(!app) return;

      var actions=app.querySelector('.today-head-actions');
      if(!actions) return;

      var wrap=actions.querySelector('.today-head-buttons');
      if(!wrap){
        wrap=document.createElement('span');
        wrap.className='today-head-buttons';
        actions.appendChild(wrap);
      }

      /* v26 ينقل الزرين إلى شريط العنوان؛ ننقلهما هنا مرة أخرى إلى الجانب المقابل */
      var inline=app.querySelector('.today-header-actions-inline');
      var ex=(inline&&inline.querySelector('button[data-a="exadd"]')) ||
             actions.querySelector('button[data-a="exadd"]');
      var unhide=(inline&&inline.querySelector('button[data-a="unhide"]')) ||
                 actions.querySelector('button[data-a="unhide"]');

      if(ex && ex.parentNode!==wrap) wrap.appendChild(ex);
      if(unhide && unhide.parentNode!==wrap) wrap.appendChild(unhide);

      /* يبقى عنصر الشارات مع العنوان ولا يدخل داخل أزرار الموعد */
      var badge=actions.querySelector('.today-notify-head');
      var titleStats=app.querySelector('.today-title-stats');
      if(badge && titleStats && badge.parentNode!==titleStats){
        titleStats.insertBefore(badge,titleStats.firstChild);
      }
    }catch(e){}
  }

  /* نطبق الترتيب بعد كل إعادة رسم حتى لا يعيده الكود السابق */
  if(typeof render==='function' && !render.__finalExceptionalPlacement){
    var baseRender=render;
    render=function(){
      var result=baseRender.apply(this,arguments);
      setTimeout(restoreExceptionalButtons,0);
      setTimeout(restoreExceptionalButtons,30);
      return result;
    };
    render.__finalExceptionalPlacement=true;
  }

  /* معالجة أول فتح للشاشة وأي تحديث لاحق لها */
  setTimeout(restoreExceptionalButtons,0);
  setTimeout(restoreExceptionalButtons,80);
  window.addEventListener('focus',restoreExceptionalButtons);

  var app=document.querySelector('#app');
  if(app && window.MutationObserver){
    var obs=new MutationObserver(function(){
      if(document.querySelector('#app .today-head-actions')){
        restoreExceptionalButtons();
      }
    });
    obs.observe(app,{childList:true,subtree:true});
  }
})();

(function(){
  'use strict';

  function orderTodayHeader(){
    try{
      var app=document.querySelector('#app');
      if(!app) return;
      var group=app.querySelector('.today-title-group');
      var stats=app.querySelector('.today-title-stats');
      if(!group || !stats) return;

      var boxes=stats.querySelectorAll('.today-inline-box');
      if(boxes.length>=2){
        /* يضمن بقاء: المنجز اليوم ثم عدد الطلاب */
        stats.insertBefore(boxes[0],stats.firstChild);
        if(boxes[1]!==stats.children[1]) stats.insertBefore(boxes[1],stats.children[1]||null);
      }

      var notify=stats.querySelector('.today-notify-head');
      var round=stats.querySelector('.today-round-alert');

      /* الترتيب الداخلي للإشارات: التقرير ثم التذكير */
      if(notify){
        var report=notify.querySelector('.today-notify.report');
        var reminder=notify.querySelector('.today-notify.reminder');
        if(report) notify.appendChild(report);
        if(reminder) notify.appendChild(reminder);
        notify.style.order='3';
        /* بعده تأتي إشارة الطلاب الذين أكملوا */
        if(round){
          round.style.order='4';
          stats.appendChild(round);
        }
        /* وضع مجموعة الإشارتين بعد صندوق عدد الطلاب */
        stats.appendChild(notify);
        if(round) stats.appendChild(round);
      }

      /* تأكيد ترتيب صندوقي الأرقام */
      if(boxes.length>=2){
        stats.insertBefore(boxes[0],stats.firstChild);
        stats.insertBefore(boxes[1],notify||round||null);
      }
    }catch(e){}
  }

  if(typeof render==='function' && !render.__v27TodayHeaderFinalOrder){
    var baseRender=render;
    render=function(){
      var result=baseRender.apply(this,arguments);
      setTimeout(orderTodayHeader,0);
      setTimeout(orderTodayHeader,30);
      return result;
    };
    render.__v27TodayHeaderFinalOrder=true;
  }

  setTimeout(orderTodayHeader,0);
  setTimeout(orderTodayHeader,80);
  window.addEventListener('focus',orderTodayHeader);
})();

(function(){

      return (r.kind||'report')==='report' && !reminderLike(r.text);
    });
  }

  function reportMatches(r){
    var s=stu(r.sid);

    var ac=String(V.repAcademy||'').trim();
    var from=String(V.repFrom||'').trim();

    if(ac && academy!==ac) return false;

    return true;
  }

  function lessonForPendingKey(k){
    try{return lessonsOn(TD()).find(function(l){return l.key===k})||null}catch(e){return null}
  }

  function rowMeta(row){
    var edit=row.querySelector('button[data-a="repedit"][data-i]');
    if(edit){
      var id=edit.getAttribute('data-i');
      var r=S.reports.find(function(x){return String(x.id)===String(id)});

        var s=stu(r.sid);
        return {kind:'actual',id:r.id,sid:r.sid,date:String(r.date||''),name:s?String(s.name||''):'—',academy:s?String(s.academy||''):'',text:String(r.text||'')};
      }

      }

  function metaMatches(m){

    var ac=String(V.repAcademy||'').trim();
    var from=String(V.repFrom||'').trim();
    var to=String(V.repTo||'').trim();
    if(q && !wm(m.name,q) && !wm(m.text,q)) return false;
    if(ac && String(m.academy||'')!==ac) return false;

  function escapeHtml(x){

    const taskList = T.length
      ? `${pending.map(taskCardNoteLayout).join('')}${complete.length ? `<div class="task-divider"></div>${complete.map(taskCardNoteLayout).join('')}` : ''}`
      : empty('لا توجد مهام بعد. اضغط «إضافة مهمة» لإضافة أول مهمة.');
    const allTasksSuccess = T.length > 0 && pending.length === 0
      ? `<div class="task-complete task-complete-tasks"><div class="wm-check"><svg class="ico" viewBox="0 0 24 24" width="60" height="60" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><div class="wm-text">تم بنجاح — تم إنجاز جميع المهام</div></div>`
      : '';
    const notePending = notes.filter(n=>!n.d);
    const noteComplete = notes.filter(n=>!!n.d);
    const noteList = notes.length
      ? `${notePending.map(noteCard).join('')}${noteComplete.length ? `${notePending.length ? '<div class="task-divider"></div>' : ''}${noteComplete.map(noteCard).join('')}` : ''}`
      : empty('لا توجد ملاحظات بعد. اضغط «إضافة ملاحظة» للبدء.');
    return `<div class="bar"><div><h1>المهام والملاحظات</h1><div class="sub" style="margin:4px 0 0">رتّب مهامك بالسحب، واحفظ ملاحظاتك مع إمكانية ضبط تنبيه لكل ملاحظة.</div></div></div>
      <div class="task-notes-grid">
        <section class="card task-notes-panel task-panel" aria-labelledby="taskPanelHeading">
          <div class="task-notes-panel-head"><h2 id="taskPanelHeading">المهام <span class="panel-count">${T.length}</span></h2><button class="btn o sm" type="button" data-a="tadd">${plusIcon} إضافة مهمة</button></div>
          ${allTasksSuccess}
          <div class="task-notes-panel-content" ${expanded?'':'hidden'}>${taskList}</div>
          <div class="task-panel-footer"><button type="button" class="btn sm task-toggle-btn" data-a="tasksToggle">${expanded?'إخفاء المهام':'إظهار المهام'}</button></div>
        </section>
        <section class="card task-notes-panel notes-panel" aria-labelledby="notesPanelHeading">
          <div class="task-notes-panel-head"><h2 id="notesPanelHeading">الملاحظات <span class="panel-count">${notes.length}</span></h2><button class="btn o sm" type="button" data-a="noteadd">${plusIcon} إضافة ملاحظة</button></div>
          <div class="notes-panel-content" ${notesExpanded?'':'hidden'}><div class="note-list">${noteList}</div></div>
          <div class="task-panel-footer"><button type="button" class="btn sm task-toggle-btn notes-toggle-btn" data-a="notesToggle">${notesExpanded?'إخفاء الملاحظات':'إظهار الملاحظات'}</button></div>
        </section>
      </div>`;
  };

  function openNoteEditor(note){
    const isNew = !note;
    const n = note || {id:uid(), title:'', text:'', reminder:'', createdAt:Date.now(), updatedAt:Date.now(), notifiedAt:0};
    const body = `<div class="note-editor">
      <label for="idaraNoteTitle">اسم الملاحظة</label><input id="idaraNoteTitle" maxlength="180" value="${esc(n.title||'')}" placeholder="اكتب اسمًا مختصرًا للملاحظة" autocomplete="off" required>
      <label for="idaraNoteText">نص الملاحظة</label><textarea id="idaraNoteText" rows="7" placeholder="اكتب تفاصيل الملاحظة هنا">${esc(n.text||'')}</textarea>
      <div class="copyrow"><button type="button" class="btn o sm voicebtn" data-a="voice" data-i="idaraNoteText" title="إملاء صوتي بالعربية" aria-label="إملاء صوتي"><span class="mic-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="8" height="12" rx="4" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></span></button></div>
      <label for="idaraNoteReminder">المنبّه (اختياري)</label><input id="idaraNoteReminder" type="datetime-local" value="${esc(n.reminder||'')}">
      <div class="note-history"><span>تاريخ الإنشاء: <b>${noteDate(n.createdAt)}</b></span><span>آخر تعديل: <b>${noteDate(n.updatedAt)}</b></span><span class="note-reminder-help">يعمل التنبيه أثناء بقاء النظام مفتوحًا في المتصفح. اسمح بإشعارات المتصفح عند الطلب.</span></div>
    </div>`;
    const extra = isNew ? '' : `<button type="button" class="btn d sm" data-a="notedel" data-i="${esc(String(n.id))}">حذف الملاحظة</button>`;
    modal(isNew?'إضافة ملاحظة':'تعديل الملاحظة', body, function(){
      const title = String($('#idaraNoteTitle')?.value||'').trim();
      const textValue = String($('#idaraNoteText')?.value||'').trim();
      const reminder = String($('#idaraNoteReminder')?.value||'').trim();
      if(!title){toast('اكتب اسم الملاحظة أولًا');return false;}
      if(reminder && Number.isNaN(new Date(reminder).getTime())){toast('تحقق من موعد المنبّه');return false;}
      const previousReminder = n.reminder || '';
      n.title = title;
      n.text = textValue;
      n.reminder = reminder;
      n.updatedAt = Date.now();
      if(previousReminder !== reminder) n.notifiedAt = 0;
      if(!n.createdAt) n.createdAt = n.updatedAt;
      if(isNew) S.notes.push(n);
      if(reminder && 'Notification' in window && Notification.permission === 'default'){
        try{Notification.requestPermission().catch(()=>{});}catch(e){}
      }
      save();
      render();
      toast(isNew?'تمت إضافة الملاحظة':'تم حفظ تعديلات الملاحظة');
      return true;
    }, 'حفظ', extra);
    setTimeout(()=>{const input=$('#idaraNoteTitle');if(input)input.focus();},40);
  }

  function noteSorted(){
    const all=[...(S.notes||[])],order=Array.isArray(S.noteorder)?S.noteorder.map(String):[];
    return all.sort((a,b)=>{const done=(a.d?1:0)-(b.d?1:0);if(done)return done;const ia=order.indexOf(String(a.id)),ib=order.indexOf(String(b.id));if(ia>=0||ib>=0){const aa=ia<0?1e9:ia,bb=ib<0?1e9:ib;if(aa!==bb)return aa-bb;}return Number(b.updatedAt||b.createdAt||0)-Number(a.updatedAt||a.createdAt||0);});
  }
  function reorderNote(dragId,targetId){
    if(!dragId||!targetId||dragId===targetId)return;
    const a=noteSorted(),from=a.findIndex(n=>String(n.id)===String(dragId)),to=a.findIndex(n=>String(n.id)===String(targetId));
    if(from<0||to<0||!!a[from].d!==!!a[to].d)return;
    const ordered=a.map(n=>String(n.id));ordered.splice(from,1);ordered.splice(to,0,String(dragId));S.noteorder=ordered;save();render();
  }

  function reorderTask(dragId, targetId){
    if(!dragId || !targetId || dragId === targetId) return;
    const ordered = taskSorted().map(t=>String(t.id));
    const from = ordered.indexOf(String(dragId)), to = ordered.indexOf(String(targetId));
    if(from<0 || to<0) return;
    ordered.splice(from,1);
    ordered.splice(to,0,String(dragId));
    S.taskorder = ordered;
    save();
    render();
  }

  A.tasksToggle = function(){
    window.__idaraTasksExpanded = !(window.__idaraTasksExpanded !== false);
    render();
  };
  A.notesToggle = function(){
    window.__idaraNotesExpanded = !(window.__idaraNotesExpanded !== false);
    render();
  };
  A.noteadd = function(){openNoteEditor(null);};

  // Clicking the task card itself opens its editor. Action buttons, the completion box,
  // drag handle, and the three-dot menu keep their dedicated behaviors.
  document.addEventListener('click', function(e){
    const row = e.target && e.target.closest && e.target.closest('.idara-task-row[data-task-row]');
    if(!row) return;
    if(e.target.closest('button, a, input, select, textarea, [data-a], .task-menu, .task-drag-handle')) return;

  A.notemenutoggle = function(e){
    const menu = e.closest('.note-menu') || e.parentElement;
    const shouldOpen = menu && !menu.classList.contains('open');
    document.querySelectorAll('.note-menu.open').forEach(x=>x.classList.remove('open'));
    if(shouldOpen) menu.classList.add('open');
  };
  document.addEventListener('click',function(e){
    if(e.target.closest && e.target.closest('.note-menu')) return;
    document.querySelectorAll('.note-menu.open').forEach(x=>x.classList.remove('open'));
  });
  A.noteopen = function(e){
    const note = S.notes.find(n=>String(n.id)===String(e.dataset.i));
    if(note) openNoteEditor(note);
  };
  document.addEventListener('keydown',function(e){const card=e.target&&e.target.closest&&e.target.closest('.note-card[data-a="noteopen"]');if(!card||(e.key!=='Enter'&&e.key!==' '))return;e.preventDefault();A.noteopen(card)});
  A.ntog = function(e){
    const note=S.notes.find(n=>String(n.id)===String(e.dataset.i));if(!note)return;
    if(!Array.isArray(S.noteorder)||!S.noteorder.length)S.noteorder=noteSorted().map(n=>String(n.id));
    note.d=!note.d;save();render();toast(note.d?'تم إنجاز الملاحظة':'تم إلغاء إنجاز الملاحظة');
  };
  A.noteedit = function(e){
    const note = S.notes.find(n=>String(n.id)===String(e.dataset.i));
    document.querySelectorAll('.note-menu.open').forEach(x=>x.classList.remove('open'));

  };
  A.notedel = function(e){
    const note = S.notes.find(n=>String(n.id)===String(e.dataset.i));
    if(!note) return;
    cfm('هل تريد حذف هذه الملاحظة نهائيًا؟', function(){
      S.notes = S.notes.filter(n=>String(n.id)!==String(e.dataset.i));
      S.noteorder=(S.noteorder||[]).filter(id=>String(id)!==String(e.dataset.i));
      save();
      const dlg=$('#dlg');if(dlg&&dlg.open)dlg.close();
      render();toast('تم حذف الملاحظة');
    });
  };

  // Desktop drag-and-drop using the six-dot grip.
  let currentTaskDrag = '';
  document.addEventListener('dragstart', function(e){
    const handle = e.target.closest && e.target.closest('[data-task-drag]');
    if(!handle) return;
    currentTaskDrag = String(handle.dataset.taskDrag||'');
    const row = handle.closest('[data-task-row]');
    if(row) row.classList.add('task-dragging');
    if(e.dataTransfer){e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',currentTaskDrag);}catch(err){}}
  });
  document.addEventListener('dragover', function(e){
    if(!currentTaskDrag) return;
    const row = e.target.closest && e.target.closest('[data-task-row]');
    if(!row) return;
    e.preventDefault();
    document.querySelectorAll('.task-drop-target').forEach(x=>x.classList.remove('task-drop-target'));
    row.classList.add('task-drop-target');
    if(e.dataTransfer)e.dataTransfer.dropEffect='move';
  });
  document.addEventListener('drop', function(e){
    if(!currentTaskDrag) return;
    const row = e.target.closest && e.target.closest('[data-task-row]');
    if(!row) return;
    e.preventDefault();
    const dragId=currentTaskDrag, targetId=String(row.dataset.taskRow||'');
    currentTaskDrag='';
    reorderTask(dragId,targetId);
  });
  document.addEventListener('dragend', function(){
    currentTaskDrag='';
    document.querySelectorAll('.task-dragging,.task-drop-target').forEach(x=>x.classList.remove('task-dragging','task-drop-target'));
  });

  // Long-press drag support for touch screens, where native HTML drag is inconsistent.
  let touchHoldTimer = null;
  let touchDragState = null;
  document.addEventListener('pointerdown', function(e){
    if(e.pointerType!=='touch') return;
    const handle=e.target.closest&&e.target.closest('[data-task-drag]');
    if(!handle) return;
    clearTimeout(touchHoldTimer);
    touchHoldTimer=setTimeout(()=>{
      touchDragState={id:String(handle.dataset.taskDrag||''), target:String(handle.dataset.taskDrag||'')};
      const row=handle.closest('[data-task-row]');if(row)row.classList.add('task-dragging');
    },360);
  }, {passive:true});
  document.addEventListener('pointermove', function(e){
    if(touchHoldTimer && !touchDragState && e.pointerType==='touch'){
      // If the finger moves before the long-press activates, let normal scrolling win.
      if(Math.abs(e.movementX||0)>10 || Math.abs(e.movementY||0)>10){clearTimeout(touchHoldTimer);touchHoldTimer=null;}
    }
    if(!touchDragState || e.pointerType!=='touch') return;
    const under=document.elementFromPoint(e.clientX,e.clientY);
    const row=under&&under.closest?under.closest('[data-task-row]'):null;
    document.querySelectorAll('.task-drop-target').forEach(x=>x.classList.remove('task-drop-target'));
    if(row){row.classList.add('task-drop-target');touchDragState.target=String(row.dataset.taskRow||'');}
    e.preventDefault();
  }, {passive:false});
  document.addEventListener('pointerup', function(e){
    clearTimeout(touchHoldTimer);touchHoldTimer=null;
    if(!touchDragState) return;
    const d=touchDragState;touchDragState=null;
    document.querySelectorAll('.task-dragging,.task-drop-target').forEach(x=>x.classList.remove('task-dragging','task-drop-target'));
    if(d.target) reorderTask(d.id,d.target);
  });
  document.addEventListener('pointercancel', function(){clearTimeout(touchHoldTimer);touchHoldTimer=null;touchDragState=null;document.querySelectorAll('.task-dragging,.task-drop-target').forEach(x=>x.classList.remove('task-dragging','task-drop-target'));});

  // Notes use the same six-dot drag interaction as tasks, on desktop and touch screens.
  let currentNoteDrag='';
  document.addEventListener('dragstart',function(e){const handle=e.target.closest&&e.target.closest('[data-note-drag]');if(!handle)return;currentNoteDrag=String(handle.dataset.noteDrag||'');const row=handle.closest('[data-note-row]');if(row)row.classList.add('note-dragging');if(e.dataTransfer){e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',currentNoteDrag)}catch(err){}}});
  document.addEventListener('dragover',function(e){if(!currentNoteDrag)return;const row=e.target.closest&&e.target.closest('[data-note-row]');if(!row)return;e.preventDefault();document.querySelectorAll('.note-drop-target').forEach(x=>x.classList.remove('note-drop-target'));row.classList.add('note-drop-target');if(e.dataTransfer)e.dataTransfer.dropEffect='move'});
  document.addEventListener('drop',function(e){if(!currentNoteDrag)return;const row=e.target.closest&&e.target.closest('[data-note-row]');if(!row)return;e.preventDefault();const dragId=currentNoteDrag,targetId=String(row.dataset.noteRow||'');currentNoteDrag='';reorderNote(dragId,targetId)});
  document.addEventListener('dragend',function(){currentNoteDrag='';document.querySelectorAll('.note-dragging,.note-drop-target').forEach(x=>x.classList.remove('note-dragging','note-drop-target'))});
  let noteTouchHoldTimer=null,noteTouchDragState=null;
  document.addEventListener('pointerdown',function(e){if(e.pointerType!=='touch')return;const handle=e.target.closest&&e.target.closest('[data-note-drag]');if(!handle)return;clearTimeout(noteTouchHoldTimer);noteTouchHoldTimer=setTimeout(()=>{noteTouchDragState={id:String(handle.dataset.noteDrag||''),target:String(handle.dataset.noteDrag||'')};const row=handle.closest('[data-note-row]');if(row)row.classList.add('note-dragging')},360)},{passive:true});
  document.addEventListener('pointermove',function(e){if(noteTouchHoldTimer&&!noteTouchDragState&&e.pointerType==='touch'&&(Math.abs(e.movementX||0)>10||Math.abs(e.movementY||0)>10)){clearTimeout(noteTouchHoldTimer);noteTouchHoldTimer=null}if(!noteTouchDragState||e.pointerType!=='touch')return;const under=document.elementFromPoint(e.clientX,e.clientY),row=under&&under.closest?under.closest('[data-note-row]'):null;document.querySelectorAll('.note-drop-target').forEach(x=>x.classList.remove('note-drop-target'));if(row){row.classList.add('note-drop-target');noteTouchDragState.target=String(row.dataset.noteRow||'')}e.preventDefault()},{passive:false});
  document.addEventListener('pointerup',function(){clearTimeout(noteTouchHoldTimer);noteTouchHoldTimer=null;if(!noteTouchDragState)return;const d=noteTouchDragState;noteTouchDragState=null;document.querySelectorAll('.note-dragging,.note-drop-target').forEach(x=>x.classList.remove('note-dragging','note-drop-target'));if(d.target)reorderNote(d.id,d.target)});
  document.addEventListener('pointercancel',function(){clearTimeout(noteTouchHoldTimer);noteTouchHoldTimer=null;noteTouchDragState=null;document.querySelectorAll('.note-dragging,.note-drop-target').forEach(x=>x.classList.remove('note-dragging','note-drop-target'))});

  // صف البحث الجانبي كامل قابل للنقر مثل بقية عناصر القائمة.

  if(sideSearch){
    sideSearch.setAttribute('aria-label','بحث سريع في كل الأقسام');
    sideSearch.setAttribute('title','بحث سريع في كل الأقسام');
  }

  function checkNoteReminders(){
    if(!Array.isArray(S.notes)||!S.notes.length) return;
    const now=Date.now();let changed=false;
    S.notes.forEach(n=>{
      if(n.d || !n.reminder || n.notifiedAt) return;
      const at=new Date(n.reminder).getTime();
      if(!Number.isFinite(at)||at>now) return;

          notice.onclick=function(){try{window.focus();}catch(e){};if(V.tab!=='tasks'){V.tab='tasks';render();}A.noteopen({dataset:{i:String(n.id)}});try{notice.close();}catch(e){}};

<script id="v33-sidebar-search-order">
(function(){
  'use strict';
  var nav=document.getElementById('nav');
  /* احتفظ بمرجع الصف حتى لو أعاد render بناء قائمة التنقل بالكامل */
  var row=document.querySelector('#sb .side-search-row');
  if(!nav||!row)return;
  function placeSearchAfterToday(){
    var today=nav.querySelector('button[data-a="tab"][data-t="today"]');
    if(today && (row.parentElement!==nav || today.nextElementSibling!==row)) today.insertAdjacentElement('afterend',row);
    row.setAttribute('aria-label','بحث');
  }
  placeSearchAfterToday();
  if(window.MutationObserver){
    var observer=new MutationObserver(function(){placeSearchAfterToday();});
    observer.observe(nav,{childList:true});
  }
})();
</script>
