<script id="final-flexible-reminder-patch">
(function(){
  'use strict';
  if (window.__finalFlexibleReminderPatch) return;
  window.__finalFlexibleReminderPatch = true;

  const dueTasks = () => (Array.isArray(S.tasks)?S.tasks:[]).filter(t=>!t.d && t.reminder && Number.isFinite(new Date(t.reminder).getTime()) && new Date(t.reminder).getTime() <= Date.now());
  const dueNotes = () => (Array.isArray(S.notes)?S.notes:[]).filter(n=>!n.d && n.reminder && Number.isFinite(new Date(n.reminder).getTime()) && new Date(n.reminder).getTime() <= Date.now());
  window.__idaraDueTaskReminders = dueTasks;
  window.__idaraDueNoteReminders = dueNotes;

  function reminderClockSvg(){return '<svg class="ico" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M5 3 2 6M19 3l3 3"/></svg>';}
  function reminderTaskSvg(){return '<svg class="ico" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 3v3M16 3v3M8 11h8M8 15h5"/></svg>';}
  function badge(action,count,label,svg,klass){
    if(!count)return '';
    return '<button type="button" class="today-reminder-alert '+klass+'" data-a="'+action+'" title="'+label+' ('+count+')" aria-label="'+label+': '+count+'"><span class="round-alert-icon">'+svg+'</span><span class="round-alert-badge">'+count+'</span></button>';
  }

  // The visible reminder badges are derived from due, still-incomplete items only.
  if(typeof VW!=='undefined' && typeof VW.today==='function' && !VW.today.__reminderBadgesWrapped){
    const baseToday=VW.today;
    const wrappedToday=function(){
      let html=baseToday.apply(this,arguments);
      const taskBadge=badge('taskReminderAlert',dueTasks().length,'حان موعد تذكير المهمة',reminderTaskSvg(),'task-reminder-alert');
      const noteBadge=badge('noteReminderAlert',dueNotes().length,'حان موعد تذكير الملاحظة',reminderClockSvg(),'note-reminder-alert');
      const extra=taskBadge+noteBadge;
      if(!extra)return html;
      const marker='<span class="today-inline-box">عدد الطلاب:';
      const start=html.indexOf(marker);
      if(start<0)return html;
      const close=html.indexOf('</span>',start);
      if(close<0)return html;
      return html.slice(0,close+7)+extra+html.slice(close+7);
    };
    wrappedToday.__reminderBadgesWrapped=true;
    VW.today=wrappedToday;
  }

  function taskEditor(task){
    const isNew=!task;
    const t=task||{id:uid(),t:'',text:'',reminder:'',d:false,createdAt:Date.now(),upd:Date.now(),notifiedAt:0};
    const body='<div class="task-editor">'+
      '<label for="idaraTaskTitle">اسم المهمة</label><input id="idaraTaskTitle" maxlength="220" value="'+esc(t.t||'')+'" placeholder="اكتب اسم المهمة" autocomplete="off" required>'+
      '<label for="idaraTaskText">نص المهمة (اختياري)</label><textarea id="idaraTaskText" rows="5" placeholder="اكتب تفاصيل المهمة هنا، أو اترك الحقل فارغًا">'+esc(t.text||'')+'</textarea>'+
      '<div class="copyrow"><button type="button" class="btn o sm voicebtn" data-a="voice" data-i="idaraTaskText" title="إملاء صوتي بالعربية" aria-label="إملاء صوتي"><span class="mic-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="8" height="12" rx="4" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></span></button></div>'+
      '<label for="idaraTaskReminder">تذكير المهمة (اختياري)</label><input id="idaraTaskReminder" type="datetime-local" value="'+esc(t.reminder||'')+'">'+
      '<div class="mu" style="margin-top:8px;line-height:1.8">سيظهر تنبيه المهمة في شاشة اليوم عند حلول موعده، وتختفي الشارة عند إنجاز المهمة.</div></div>';
    const extra=isNew?'':'<button type="button" class="btn d sm" data-a="tdel" data-i="'+esc(String(t.id))+'">حذف المهمة</button>';
    modal(isNew?'إضافة مهمة':'تعديل المهمة',body,function(){
      const title=String($('#idaraTaskTitle')?.value||'').trim();
      const textValue=String($('#idaraTaskText')?.value||'').trim();
      const reminder=String($('#idaraTaskReminder')?.value||'').trim();
      if(!title){toast('اكتب اسم المهمة أولًا');return false;}
      if(reminder && Number.isNaN(new Date(reminder).getTime())){toast('تحقق من موعد التذكير');return false;}
      const previousReminder=t.reminder||'';
      t.t=title;t.text=textValue;t.reminder=reminder;t.upd=Date.now();
      if(!t.createdAt)t.createdAt=t.upd;
      if(previousReminder!==reminder)t.notifiedAt=0;
      if(isNew)S.tasks.push(t);
      if(reminder && 'Notification' in window && Notification.permission==='default'){
        try{Notification.requestPermission().catch(()=>{});}catch(e){}
      }
      save();render();toast(isNew?'تمت إضافة المهمة':'تم حفظ تعديلات المهمة');return true;
    },'حفظ',extra);
    setTimeout(()=>{const el=$('#idaraTaskTitle');if(el)el.focus();},30);
  }

  // Replace only task CRUD handlers to add optional description and reminder fields.
  if(typeof A!=='undefined'){
    A.tadd=function(){taskEditor(null);};
    A.tedit=function(e){const t=(S.tasks||[]).find(x=>String(x.id)===String(e.dataset.i));if(t)taskEditor(t);};
    A.taskReminderAlert=function(){openDueModal('task');};
    A.noteReminderAlert=function(){openDueModal('note');};
    A.reminderTaskDone=function(e){
      const t=(S.tasks||[]).find(x=>String(x.id)===String(e.dataset.i));if(!t)return;
      t.d=true;t.upd=Date.now();save();const d=$('#dlg');if(d&&d.open)d.close();render();toast('تم إنجاز المهمة');
    };
    A.reminderNoteDone=function(e){
      const n=(S.notes||[]).find(x=>String(x.id)===String(e.dataset.i));if(!n)return;
      n.d=true;n.updatedAt=Date.now();save();const d=$('#dlg');if(d&&d.open)d.close();render();toast('تم إنجاز الملاحظة');
    };
    A.reminderTaskOpen=function(e){const t=(S.tasks||[]).find(x=>String(x.id)===String(e.dataset.i));const d=$('#dlg');if(d&&d.open)d.close();if(t)taskEditor(t);};
    A.reminderNoteOpen=function(e){const n=(S.notes||[]).find(x=>String(x.id)===String(e.dataset.i));const d=$('#dlg');if(d&&d.open)d.close();if(n&&typeof A.noteopen==='function')A.noteopen({dataset:{i:String(n.id)}});};
  }

  function openDueModal(kind){
    const isTask=kind==='task', items=isTask?dueTasks():dueNotes();
    if(!items.length){toast('لا توجد تذكيرات مستحقة الآن');render();return;}
    const rows=items.map(item=>{
      const id=esc(String(item.id));
      const title=esc(isTask?(item.t||'مهمة بدون اسم'):(item.title||'ملاحظة بدون عنوان'));
      const detail=String(item.text||'').trim();
      const desc=detail?'<div class="mu reminder-desc">'+esc(detail)+'</div>':'';
      const openAction=isTask?'reminderTaskOpen':'reminderNoteOpen';
      const doneAction=isTask?'reminderTaskDone':'reminderNoteDone';
      return '<div class="card due-reminder-row"><div class="due-reminder-copy"><b>'+title+'</b>'+desc+'</div><div class="due-reminder-actions"><button type="button" class="btn sm" data-a="'+openAction+'" data-i="'+id+'">فتح</button><button type="button" class="btn o sm" data-a="'+doneAction+'" data-i="'+id+'">تم</button></div></div>';
    }).join('');
    modal(isTask?'مهام حان موعد تذكيرها':'ملاحظات حان موعد تذكيرها', '<div class="mu" style="margin-bottom:10px">هذه العناصر حلّ موعد تذكيرها ولم تُنجز بعد.</div>'+rows,null,'إغلاق');
  }

  // Deliver browser notifications when due; the dashboard badge persists until completion.
  function checkTaskReminders(){
    if(!Array.isArray(S.tasks)||!S.tasks.length)return;
    const now=Date.now();let changed=false;
    S.tasks.forEach(t=>{
      if(t.d||!t.reminder||t.notifiedAt)return;
      const at=new Date(t.reminder).getTime();if(!Number.isFinite(at)||at>now)return;
      t.notifiedAt=now;changed=true;let shown=false;
      if('Notification' in window && Notification.permission==='granted'){
        try{const notice=new Notification('موعد المهمة: '+(t.t||'مهمة'),{body:(t.text||'حان وقت تنفيذ المهمة.').slice(0,180),tag:'idara-task-'+t.id,renotify:false});notice.onclick=function(){try{window.focus();}catch(e){};if(V.tab!=='tasks'){V.tab='tasks';render();}taskEditor(t);try{notice.close();}catch(x){}};shown=true;}catch(e){}
      }
      if(!shown)toast('حان موعد المهمة: '+(t.t||'مهمة'));
    });
    if(changed)save();
  }
  checkTaskReminders();
  window.__idaraTaskReminderTimer=setInterval(checkTaskReminders,20000);

  // Refresh today's badges as soon as a reminder becomes due, without repainting an open dialog.
  let lastDueKey='';
  let dueRenderPending=false;
  function dueKey(){return dueTasks().map(x=>'t:'+x.id).join('|')+'#'+dueNotes().map(x=>'n:'+x.id).join('|')+'#'+(typeof roundDueNotificationCount==='function'?roundDueNotificationCount():0);}
  function refreshDueBadges(){
    const key=dueKey();
    if(key!==lastDueKey){lastDueKey=key;dueRenderPending=true;}
    if(dueRenderPending && typeof V!=='undefined' && V.tab==='today' && !(typeof dlgOpen==='function'&&dlgOpen())){
      dueRenderPending=false;
      render();
    }
  }
  refreshDueBadges();
  window.__idaraDueBadgeTimer=setInterval(refreshDueBadges,4000);

  // Universal clear buttons for every date picker created now or later in the system.
  const dateClearStyle=document.createElement('style');
  dateClearStyle.id='universal-date-clear-style';
  dateClearStyle.textContent=`
    .date-clear-wrap{display:block;position:relative;width:100%;min-width:0;}
    .date-clear-wrap>input[type="date"],.date-clear-wrap>input[type="datetime-local"],.date-clear-wrap>input[type="month"]{width:100%!important;padding-left:40px!important;}
    .date-clear-btn{display:none;position:absolute;left:6px;top:50%;transform:translateY(-50%);z-index:5;width:25px;height:25px;min-width:25px;min-height:25px;padding:0!important;align-items:center;justify-content:center;border:1px solid var(--line,#34445b)!important;border-radius:50%!important;background:var(--card,#111d31)!important;color:var(--mu,#90a2b8)!important;box-shadow:none!important;line-height:1;font-size:17px;font-weight:800;cursor:pointer;}
    .date-clear-wrap.has-value>.date-clear-btn{display:inline-flex;}
    .date-clear-btn:hover{background:var(--danger-soft,rgba(239,106,98,.14))!important;color:var(--danger,#ef6a62)!important;border-color:var(--danger,#ef6a62)!important;}
    .date-clear-btn:focus-visible{outline:none;box-shadow:var(--ring,0 0 0 3px rgba(47,191,168,.25))!important;}
    .date-clear-wrap>input:disabled+.date-clear-btn{display:none!important;}
  `;
  document.head.appendChild(dateClearStyle);
  function dateInputSetValue(input){
    const wrap=input.closest('.date-clear-wrap');
    if(wrap)wrap.classList.toggle('has-value',!!input.value);
    input.classList.toggle('date-empty',!input.value);
  }
  function installDateClear(root){
    (root||document).querySelectorAll('input[type="date"],input[type="datetime-local"],input[type="month"]').forEach(input=>{
      if(input.__universalDateClear)return;
      input.__universalDateClear=true;
      let wrap=input.closest('.date-clear-wrap');
      if(!wrap){
        wrap=document.createElement('span');wrap.className='date-clear-wrap';
        input.parentNode.insertBefore(wrap,input);wrap.appendChild(input);
      }
      let button=wrap.querySelector('.date-clear-btn');
      if(!button){
        button=document.createElement('button');button.type='button';button.className='date-clear-btn';button.setAttribute('aria-label','مسح التاريخ');button.title='مسح التاريخ';
        button.innerHTML='<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';
        wrap.appendChild(button);
        button.addEventListener('mousedown',e=>e.preventDefault());
        button.addEventListener('click',e=>{
          e.preventDefault();e.stopPropagation();
          if(input.disabled||!input.value)return;
          input.value='';dateInputSetValue(input);
          input.dispatchEvent(new Event('input',{bubbles:true}));
          input.dispatchEvent(new Event('change',{bubbles:true}));
          try{input.focus({preventScroll:true});}catch(x){try{input.focus();}catch(y){}}
        });
      }
      input.addEventListener('input',()=>dateInputSetValue(input));
      input.addEventListener('change',()=>dateInputSetValue(input));
      dateInputSetValue(input);
    });
  }
  installDateClear(document);
  if(window.MutationObserver){
    const observer=new MutationObserver(records=>{
      for(const record of records){
        for(const node of record.addedNodes||[]){if(node.nodeType===1){if(node.matches&&node.matches('input[type="date"],input[type="datetime-local"],input[type="month"]'))installDateClear(node.parentNode||document);else installDateClear(node);}}
      }
    });
    observer.observe(document.documentElement,{childList:true,subtree:true});
  }

  const extraStyle=document.createElement('style');
  extraStyle.id='task-reminder-and-dashboard-style';
  extraStyle.textContent=`
    #app .today-reminder-alert{display:inline-flex!important;align-items:center!important;justify-content:center!important;gap:5px!important;min-width:34px!important;height:30px!important;min-height:30px!important;padding:3px 7px!important;border:1px solid rgba(22,163,74,.55)!important;border-radius:999px!important;background:rgba(22,163,74,.10)!important;color:#15803d!important;cursor:pointer!important;box-shadow:var(--shadow-sm)!important;vertical-align:middle!important;flex:none!important;margin:0!important;}
    #app .today-reminder-alert:hover{background:rgba(22,163,74,.17)!important;border-color:#16a34a!important;}
    #app .today-reminder-alert .round-alert-icon{display:inline-flex!important;align-items:center!important;justify-content:center!important;width:19px!important;height:19px!important;border:2px solid #16a34a!important;border-radius:50%!important;color:#16a34a!important;}
    #app .today-reminder-alert .round-alert-badge{display:inline-flex!important;align-items:center!important;justify-content:center!important;min-width:20px!important;height:20px!important;padding:0 5px!important;border-radius:999px!important;background:#16a34a!important;color:#fff!important;font-size:11px!important;font-weight:900!important;line-height:1!important;}
    #app .today-title-stats>.today-reminder-alert{order:4!important;flex:none!important;margin:0!important;}
    #app .today-title-stats>.today-round-alert{order:6!important;}
    #app .idara-task-row .tx{display:flex;flex-direction:column;gap:3px;min-width:0;}
    #app .idara-task-row .task-title{font-weight:800;overflow-wrap:anywhere;}
    #app .idara-task-row .task-description{font-size:12.5px;line-height:1.65;color:var(--mu);white-space:pre-wrap;overflow-wrap:anywhere;}
    #app .idara-task-row.on .task-description{opacity:.7;text-decoration:line-through;}
    #app .idara-task-row .task-reminder-caption{display:inline-flex;align-items:center;gap:5px;font-size:11px;line-height:1.5;color:var(--teal);overflow-wrap:anywhere;}
    .task-editor textarea{width:100%;min-height:105px;resize:vertical;}
    .due-reminder-row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:11px;margin:0 0 8px;flex-wrap:wrap;}
    .due-reminder-copy{flex:1;min-width:150px;overflow-wrap:anywhere;}
    .due-reminder-copy>b{font-weight:800;}
    .due-reminder-copy .reminder-desc{white-space:pre-wrap;line-height:1.7;margin-top:4px;}
    .due-reminder-actions{display:flex;gap:6px;align-items:center;flex:none;}
    .date-clear-wrap{vertical-align:middle;}
    @media(max-width:520px){.due-reminder-row{align-items:stretch}.due-reminder-actions{width:100%;justify-content:flex-start}.due-reminder-actions .btn{min-width:72px}}
  `;
  document.head.appendChild(extraStyle);
})();
</script>

<script id="v41-current-round-payment-alert-fix">
(function(){
  'use strict';
  if(window.__v41CurrentRoundPaymentAlertFix)return;
  window.__v41CurrentRoundPaymentAlertFix=true;

  /* موازنة بيانات النسخ السابقة: الراوند الحالي الذي فُتح تلقائيًا لا يرث حالة دفع قديمة بالخطأ. */
  function migrateCurrentRoundStatus(){
    if(typeof S==='undefined'||!S||!Array.isArray(S.students))return;
    var changed=false;
    S.students.forEach(function(s){
      if(!s||!isPrivateStudent(s)||s._roundPaymentAlertV41)return;
      var completed=studentCompletedRounds(s);
      var rounds=ensureStudentRounds(s);
      if(completed>0&&rounds[completed]&&rounds[completed].paid){
        rounds[completed].paid=false;
        rounds[completed].paidAt='';
        changed=true;
      }
      s._roundPaymentAlertV41=true;
      changed=true;
    });
    if(changed)save();
  }

  /* الشارة تخص الراوند الجديد الحالي بعد اكتمال راوند سابق، لا الراوندات القديمة. */
  window.roundDueStudents=function(){
    migrateCurrentRoundStatus();
    var list=[];
    (S.students||[]).forEach(function(s){
      if(!s||!isPrivateStudent(s))return;
      var size=studentRoundSize(s);
      var completed=studentCompletedRounds(s);
      if(size<=0||completed<1)return; // لا شارة للراوند الأول قبل أن يكتمل أي راوند.
      var rounds=ensureStudentRounds(s);
      while(rounds.length<=completed)rounds.push({paid:false,openedAt:TD(),paidAt:'',note:''});
      var active=rounds[completed];
      if(active&&!active.paid)list.push({student:s,roundIndex:completed});
    });
    return list;
  };
  window.roundDueNotificationCount=function(){return window.roundDueStudents().length;};

  window.roundDueStudentsModal=function(){
    var list=window.roundDueStudents();
    if(!list.length){toast('لا يوجد راوند جديد بانتظار تأكيد الدفع');return;}
    var rows=list.map(function(x){
      var s=x.student,rn=x.roundIndex+1,size=studentRoundSize(s);
      return '<div class="card round-alert-student" style="padding:11px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px">'+
        '<div style="flex:1;min-width:180px"><b>'+esc(s.name)+'</b><div class="mu">الراوند الجديد رقم '+rn+' — '+size+' حلقات — بانتظار تأكيد الدفع</div></div>'+
        '<button class="btn o sm" type="button" data-a="roundAlertOpen" data-i="'+esc(String(s.id))+'">بيانات الراوند</button></div>';
    }).join('');
    modal('الراوندات الجديدة بانتظار الدفع','<div class="mu" style="margin-bottom:10px">تظهر هنا أسماء الطلاب الذين أكملوا راوندًا وبدأ لهم راوند جديد، ولم يتم تأكيد دفع الراوند الجديد بعد. افتح بيانات الطالب لتأكيد الدفع أو إرسال تذكير.</div>'+rows,null);
  };

  /* عند عبور نهاية الراوند، ينشأ الراوند الجديد غير مدفوع حتى لو كان له سجل قديم بالخطأ. */
  if(typeof A!=='undefined'&&typeof A.att==='function'&&!A.att.__v41CurrentRoundWrapped){
    var originalAtt=A.att;
    var wrappedAtt=function(e){
      var key=TD()+'|'+String(e&&e.dataset?e.dataset.k:'');
      var lesson=null,student=null,beforeDone=0,wasDone=!!(S.att&&S.att[key]);
      try{
        lesson=lessonsOn(TD()).find(function(x){return x.key===String(e.dataset.k)});
        student=lesson&&lesson.s;
        if(student&&isPrivateStudent(student))beforeDone=studentCompletedRounds(student);
      }catch(err){}
      var result=originalAtt.apply(this,arguments);
      try{
        var isDone=!!(S.att&&S.att[key]);
        if(student&&isPrivateStudent(student)&&!wasDone&&isDone){
          var afterDone=studentCompletedRounds(student);
          if(afterDone>beforeDone&&afterDone>0){
            var rounds=ensureStudentRounds(student);
            while(rounds.length<=afterDone)rounds.push({paid:false,openedAt:TD(),paidAt:'',note:''});
            var opened=rounds[afterDone];
            opened.paid=false;
            opened.paidAt='';
            opened.openedAt=TD();
            student._roundPaymentAlertV41=true;
            save();
            render();
            toast('تم فتح الراوند رقم '+(afterDone+1)+' للطالب '+student.name+'، وهو بانتظار تأكيد الدفع');
          }
        }
      }catch(err){console.error('Round opening alert update failed:',err)}
      return result;
    };
    wrappedAtt.__v41CurrentRoundWrapped=true;
    A.att=wrappedAtt;
  }

  /* التحديث الفوري بعد الدفع/فتح الراوند، مع الإبقاء على إعادة الرسم الموجودة في النظام. */
  if(typeof render==='function'&&!render.__v41CurrentRoundBadgeRefresh){
    var oldRender=render;
    var refreshedRender=function(){
      var result=oldRender.apply(this,arguments);
      requestAnimationFrame(function(){
        try{
          var host=document.querySelector('#app .today-title-stats');
          if(!host||typeof VW==='undefined'||V.tab!=='today')return;
          var count=window.roundDueNotificationCount();
          var badge=host.querySelector('.today-round-alert');
          if(count>0){
            var html='<button type="button" class="today-round-alert" data-a="roundAlert" title="راوندات جديدة بانتظار تأكيد الدفع" aria-label="'+count+' راوندات جديدة بانتظار الدفع"><span class="round-alert-icon"><svg class="ico" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="round-alert-badge">'+count+'</span></button>';
            if(badge)badge.outerHTML=html;else host.insertAdjacentHTML('beforeend',html);
          }else if(badge){badge.remove();}
        }catch(err){}
      });
      return result;
    };
    refreshedRender.__v41CurrentRoundBadgeRefresh=true;
    render=refreshedRender;
  }

  /* جهّز الحالات القديمة قبل أول عرض، ثم حدّث شاشة اليوم لتظهر الشارة الصحيحة. */
  try{migrateCurrentRoundStatus();}catch(err){}
})();
</script>

<script id="user-final-quick-search-placement">
(function(){
  'use strict';
  if(window.__idaraQuickSearchPlacementFinal) return;
  window.__idaraQuickSearchPlacementFinal = true;

  function placeQuickSearch(){
    try{
      var app = document.querySelector('#app');
      if(!app) return;

      /* توحيد الاسم الظاهر والاسم المساعد للعدسة في النظام. */
      app.querySelectorAll('button[data-a="gsearch"], .gsearch-btn, .side-gsearch').forEach(function(btn){
        var label = btn.classList.contains('side-gsearch') ? 'بحث سريع في كل الأقسام' : 'بحث سريع';
        btn.setAttribute('title', label);
        btn.setAttribute('aria-label', label);
      });

      var group = app.querySelector('.today-title-group');
      var stats = group && group.querySelector('.today-title-stats');
      var search = app.querySelector('.today-search-inline[data-a="gsearch"]');
      if(!group || !stats || !search) return;

      /* بعد كلمة «اليوم» مباشرة وقبل شارة «المنجز اليوم». */
      if(search.parentNode !== group || search.nextElementSibling !== stats){
        group.insertBefore(search, stats);
      }
    }catch(e){}
  }

  placeQuickSearch();
  setTimeout(placeQuickSearch, 0);
  setTimeout(placeQuickSearch, 80);
  window.addEventListener('focus', placeQuickSearch);

  var app = document.querySelector('#app');
  if(app && window.MutationObserver){
    var observer = new MutationObserver(function(){ placeQuickSearch(); });
    observer.observe(app, {childList:true, subtree:true});
  }
})();
</script>
